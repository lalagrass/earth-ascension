<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宗門編年</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <h1>宗門編年</h1>
    <p class="notice">宗門的人會依目標自己生活；你可以給主角下令、調整政策與目標、回應詢問。世界存在這個瀏覽器（暫停、每日、突破後自動保存），也可以匯出成檔案。</p>
  </header>

  <section id="setup" aria-labelledby="setup-title">
    <h2 id="setup-title">開局</h2>
    <form id="setup-form">
      <label>seed <input id="seed" name="seed" value="rt-dev-000" maxlength="64" autocomplete="off" required></label>
      <span id="seed-error" class="error-inline" role="alert"></span>
      <fieldset id="setup-character"><legend>主角</legend></fieldset>
      <div id="setup-settings"></div>
      <p id="setup-error" class="error-inline" role="alert"></p>
      <button id="start" type="submit">開始新局（Enter）</button>
    </form>
    <h3>存檔</h3>
    <div id="save-panel"></div>
    <div class="buttons"><button type="button" data-import>從檔案匯入</button></div>
    <p id="setup-save-error" class="error-inline" role="alert"></p>
  </section>
  <input id="import-file" type="file" accept=".json,application/json" hidden>

  <main id="viewer" hidden>
    <section id="controls" aria-label="播放控制">
      <div id="hud"></div>
      <div class="buttons">
        <button id="toggle" type="button">暫停／繼續（空白鍵）</button>
        <span role="group" aria-label="倍速">
          <button type="button" data-speed="1">1×（鍵 1）</button>
          <button type="button" data-speed="2">2×（鍵 2）</button>
          <button type="button" data-speed="4">4×（鍵 4）</button>
        </span>
      </div>
      <div class="buttons" role="group" aria-label="存檔">
        <button type="button" id="save-now">立即保存</button>
        <button type="button" id="export">匯出存檔</button>
        <button type="button" data-import>匯入</button>
        <button type="button" id="to-setup">新局／讀取存檔</button>
      </div>
      <p id="save-status" class="save-status" role="status"></p>
      <div id="viewer-save-raw" class="buttons"></div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>
    <div class="stage">
      <div id="scene-wrap">
        <canvas id="scene" tabindex="0" aria-label="道館與周邊的斜視場景。點人物選取，點地點看主角能做的事。鍵盤：[ ] 換人、方向鍵平移、+／- 縮放、0 重設；地點清單在下方。"></canvas>
        <div id="hint" class="hint"></div>
        <div id="banner" class="banner" hidden></div>
        <section id="menu" class="menu" aria-label="可做操作" hidden></section>
      </div>
      <details id="roster" open>
        <summary>人物</summary>
        <section id="people" aria-label="人物"></section>
      </details>
    </div>
    <p id="toast" class="toast" role="status" aria-live="polite"></p>
    <div class="layout">
      <div class="col">
        <section id="asks" aria-label="待回應的詢問"></section>
        <section id="detail" aria-label="選取人物"></section>
        <div id="detail-actions" class="buttons"></div>
      </div>
      <div class="col">
        <section id="settings" aria-label="政策與目標"></section>
        <div class="buttons"><button type="button" id="edit-settings">修改政策與目標…</button></div>
        <section id="stock" aria-label="庫存與設施"></section>
        <section id="places" aria-label="地點清單"></section>
      </div>
    </div>
    <section id="events" aria-label="事件"></section>
  </main>

  <script src="../js/rng.js"></script>
  <script src="../js/rules.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/story-data.js"></script>
  <script src="../js/story.js"></script>
  <script src="../js/progression.js"></script>
  <script src="../js/commands.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/autonomy.js"></script>
  <script src="../js/realtime.js"></script>
  <script src="../js/storage.js"></script>
  <script src="controller.js"></script>
  <script src="view.js"></script>
  <script src="actions.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
