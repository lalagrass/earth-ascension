<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- LP-13 竹林步道局部素材小樣（修竹、竹節、枝葉與地表落葉陰影） -->
  <defs>
    <linearGradient id="bambooStem1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a7336"/>
      <stop offset="50%" stop-color="#6fa352"/>
      <stop offset="100%" stop-color="#426630"/>
    </linearGradient>
    <linearGradient id="bambooStem2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55823e"/>
      <stop offset="50%" stop-color="#7eb55e"/>
      <stop offset="100%" stop-color="#4c7336"/>
    </linearGradient>
  </defs>
  <!-- 地表陰影 -->
  <ellipse cx="150" cy="275" rx="120" ry="18" fill="#58563c" opacity="0.3"/>
  <!-- 竹竿 1 (左) -->
  <rect x="60" y="20" width="12" height="250" rx="3" fill="url(#bambooStem1)"/>
  <line x1="58" y1="70" x2="74" y2="70" stroke="#314a22" stroke-width="2.5"/>
  <line x1="58" y1="125" x2="74" y2="125" stroke="#314a22" stroke-width="2.5"/>
  <line x1="58" y1="180" x2="74" y2="180" stroke="#314a22" stroke-width="2.5"/>
  <line x1="58" y1="230" x2="74" y2="230" stroke="#314a22" stroke-width="2.5"/>
  <!-- 竹竿 2 (中) -->
  <rect x="140" y="10" width="15" height="265" rx="3" fill="url(#bambooStem2)"/>
  <line x1="138" y1="60" x2="157" y2="60" stroke="#314a22" stroke-width="3"/>
  <line x1="138" y1="115" x2="157" y2="115" stroke="#314a22" stroke-width="3"/>
  <line x1="138" y1="170" x2="157" y2="170" stroke="#314a22" stroke-width="3"/>
  <line x1="138" y1="225" x2="157" y2="225" stroke="#314a22" stroke-width="3"/>
  <!-- 竹竿 3 (右) -->
  <rect x="220" y="30" width="11" height="240" rx="3" fill="url(#bambooStem1)"/>
  <line x1="218" y1="80" x2="233" y2="80" stroke="#314a22" stroke-width="2.5"/>
  <line x1="218" y1="135" x2="233" y2="135" stroke="#314a22" stroke-width="2.5"/>
  <line x1="218" y1="190" x2="233" y2="190" stroke="#314a22" stroke-width="2.5"/>
  <!-- 竹葉叢 (典型多片披針形葉片) -->
  <!-- 左上枝葉 -->
  <path d="M 66 70 Q 40 55 15 65 Q 42 75 66 70" fill="#629447"/>
  <path d="M 66 70 Q 45 80 20 95 Q 46 90 66 70" fill="#71a852"/>
  <path d="M 66 70 Q 50 60 30 45 Q 52 65 66 70" fill="#54823d"/>
  <!-- 中間枝葉 -->
  <path d="M 148 60 Q 110 40 80 50 Q 115 65 148 60" fill="#6ba04d"/>
  <path d="M 154 60 Q 185 45 210 55 Q 180 70 154 60" fill="#79b257"/>
  <path d="M 148 115 Q 110 100 75 110 Q 112 122 148 115" fill="#58853f"/>
  <path d="M 154 115 Q 190 95 225 105 Q 188 122 154 115" fill="#6ba04d"/>
  <!-- 右側枝葉 -->
  <path d="M 226 80 Q 255 65 285 75 Q 256 90 226 80" fill="#629447"/>
  <path d="M 226 80 Q 250 95 280 110 Q 252 105 226 80" fill="#73ab54"/>
</svg>
