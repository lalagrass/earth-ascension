<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- LP-13 溪橋小樣（溪流、石橋墩、木質橋板與前後欄杆） -->
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a6a82" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4f829e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a6a82" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- 溪流基底 -->
  <path d="M 0 40 Q 150 70 240 120 T 400 190 L 400 200 L 0 200 Z" fill="url(#streamGrad)"/>
  <path d="M 0 10 Q 160 50 250 110 T 400 170" stroke="#7eb2cc" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 20 60 Q 180 80 270 130 T 380 185" stroke="#9ecede" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- 橋墩 -->
  <rect x="130" y="70" width="36" height="50" rx="4" fill="#58564e" stroke="#403e38"/>
  <rect x="230" y="100" width="36" height="55" rx="4" fill="#58564e" stroke="#403e38"/>
  <!-- 後欄杆 (zIndex 較低) -->
  <line x1="80" y1="85" x2="310" y2="125" stroke="#684e36" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="95" x2="310" y2="135" stroke="#7d5e42" stroke-width="3" stroke-linecap="round"/>
  <!-- 欄杆立柱 (後) -->
  <line x1="90" y1="80" x2="90" y2="102" stroke="#5a422e" stroke-width="5"/>
  <line x1="150" y1="90" x2="150" y2="112" stroke="#5a422e" stroke-width="5"/>
  <line x1="210" y1="100" x2="210" y2="122" stroke="#5a422e" stroke-width="5"/>
  <line x1="270" y1="110" x2="270" y2="132" stroke="#5a422e" stroke-width="5"/>
  <!-- 橋面主木板 -->
  <polygon points="70,102 320,142 320,165 70,125" fill="#9e7c54" stroke="#6a5034" stroke-width="2"/>
  <!-- 橋面橫向板條紋理 -->
  <line x1="100" y1="107" x2="100" y2="130" stroke="#7a5c3a" stroke-width="2"/>
  <line x1="130" y1="112" x2="130" y2="135" stroke="#7a5c3a" stroke-width="2"/>
  <line x1="160" y1="117" x2="160" y2="140" stroke="#7a5c3a" stroke-width="2"/>
  <line x1="190" y1="122" x2="190" y2="145" stroke="#7a5c3a" stroke-width="2"/>
  <line x1="220" y1="127" x2="220" y2="150" stroke="#7a5c3a" stroke-width="2"/>
  <line x1="250" y1="132" x2="250" y2="155" stroke="#7a5c3a" stroke-width="2"/>
  <line x1="280" y1="137" x2="280" y2="160" stroke="#7a5c3a" stroke-width="2"/>
  <!-- 前欄杆 (zIndex 較高，人物走在中間會被遮住腳踝) -->
  <line x1="70" y1="122" x2="320" y2="162" stroke="#7d5e42" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="112" x2="320" y2="152" stroke="#8d6c4c" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="107" x2="85" y2="130" stroke="#5a422e" stroke-width="5"/>
  <line x1="145" y1="117" x2="145" y2="140" stroke="#5a422e" stroke-width="5"/>
  <line x1="205" y1="127" x2="205" y2="150" stroke="#5a422e" stroke-width="5"/>
  <line x1="265" y1="137" x2="265" y2="160" stroke="#5a422e" stroke-width="5"/>
</svg>
