<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>挑水小場景 · 可操作展示</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>
<div id="tags" aria-hidden="true"></div>
<header class="hud">
  <span class="title">宗門編年</span><span class="sub">挑水展示 V3</span>
  <button id="play" class="btn" title="空白鍵">❚❚ 暫停</button>
  <span class="group" role="group" aria-label="播放倍率">
    <button class="btn speed on" data-speed="1" title="1">1×</button><button class="btn speed" data-speed="2" title="2">2×</button><button class="btn speed" data-speed="4" title="4">4×</button>
  </span>
  <span class="muted">播放倍率</span>
  <button id="reset" class="btn" title="重新開始，腳力回到 Lv 1">重來</button>
  <span class="spacer"></span>
  <span class="chip" id="clock">0:00</span>
  <span class="chip" id="vat">水缸 3／8 擔</span>
  <span class="chip" id="leg">腳力 Lv 1</span>
  <span class="chip" id="trips">已挑 0 趟</span>
  <button class="btn on" id="shadow-toggle" title="S：初始腳力影子">影子</button>
  <button class="btn" id="roster-toggle" title="R">名冊</button>
</header>
<div id="banner" class="banner" hidden></div>
<div id="menu" class="menu" hidden role="dialog" aria-label="地點操作"></div>
<aside id="panel" class="panel" hidden aria-live="polite"></aside>
<footer id="roster" class="roster"></footer>
<div id="toast" class="toast" hidden role="status"></div>
<div class="hint">點人物看工作與腳力；點水缸或泉水下令（會自動暫停）· 拖曳平移 · 滾輪或 +/- 縮放 · 0 重設鏡頭</div>
<script type="module" src="app.mjs"></script>
</body>
</html>
