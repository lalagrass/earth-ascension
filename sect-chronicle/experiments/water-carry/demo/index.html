<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宗門編年 · 生活開發版</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../../character-card/style.css">
<link rel="stylesheet" href="../../../event-view/style.css">
<link rel="stylesheet" href="../../../resource-view/style.css">
<link rel="stylesheet" href="../../../intent-view/style.css">
<link rel="stylesheet" href="../../../navigation-view/style.css">
</head>
<body>
<div id="stage"></div>
<div id="tags" aria-hidden="true"></div>
<header class="hud">
  <span class="title">宗門編年</span><span class="sub">生活開發版 · 尚未存檔</span>
  <button id="play" class="btn" title="空白鍵">❚❚ 暫停</button>
  <span class="group" role="group" aria-label="播放倍率">
    <button class="btn speed on" data-speed="1" title="1">1×</button><button class="btn speed" data-speed="2" title="2">2×</button><button class="btn speed" data-speed="4" title="4">4×</button>
  </span>
  <span class="muted">播放倍率</span>
  <button id="reset" class="btn" title="新局：主角 Lv 1、小女孩沿原第二人 Lv 3，兩人挑水；清除兩人工作意圖、藥架與預約">重來</button>
  <button id="save" class="btn" title="手動存檔（本機瀏覽器，只有一格；不自動存）">存檔</button>
  <button id="load" class="btn" title="讀回手動存檔：完整驗證通過才替換目前這局，讀後暫停">讀檔</button>
  <span class="spacer"></span>
  <span class="chip" id="clock">0:00</span>
  <span class="chip" id="vat">水缸 3／8 擔</span>
  <span class="chip" id="herbs">藥架 0／8 份</span>
  <button class="btn" id="navigation-toggle" aria-expanded="false" aria-controls="navigation">導覽</button>
  <button class="btn" id="resource-toggle" aria-expanded="false" aria-controls="resources">資源</button>
  <span class="chip" id="leg">主角 Lv 1</span>
  <span class="chip" id="trips">共挑 0 趟</span>
  <button class="btn on" id="shadow-toggle" title="S：主角的初始腳力對照，不產水">初始影子</button>
  <button class="btn" id="roster-toggle" title="R">名冊</button>
  <button class="btn on" id="follow-toggle" title="0 鍵或點擊：切換鏡頭跟隨">🎥 跟隨中</button>
  <a class="legacy-link" href="../../../viewer/" title="舊版修行／目標／招募與原存檔仍在這裡；新版不自動匯入或覆寫">舊版與存檔</a>
</header>
<nav id="views" class="views" aria-label="地標快看（只移鏡頭）"></nav>
<div id="banner" class="banner" hidden></div>
<div id="menu" class="menu" hidden role="dialog" aria-label="地點操作"></div>
<aside id="panel" class="panel" hidden aria-live="polite"></aside>
<aside id="boar" class="boarcard" aria-label="野豬狀態"></aside>
<aside id="resources" class="resource-overview" aria-label="資源總覽" hidden></aside>
<aside id="navigation" aria-label="場景導覽（只移鏡頭與選取）" hidden></aside>
<footer id="roster" class="roster"></footer>
<div id="toast" class="toast" hidden role="status"></div>
<div class="hint">點主角或收養的小女孩看工作與腳力，於生活總覽可邀聊／聽她鼓勵；兩人先真走到院中、面對面說話，最近相處只本局。原挑水採藥、茶、練掌、砍柴修屋與巡山仍在同一入口；點人物與設施可下原指令 · 拖曳平移 · 滾輪或 +/- 縮放 · 0 重設鏡頭。女孩目前用單張水彩造型，沒有逐幀動作圖；移動與結果照原模型，保存升版與手機仍未接。</div>
<script type="module" src="app.mjs"></script>
</body>
</html>
