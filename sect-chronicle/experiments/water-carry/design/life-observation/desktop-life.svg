<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      .bg { fill: #f4ecdc; }
      .mountain-back { fill: #d7e3c8; }
      .mountain-front { fill: #e7f0d4; }
      .river-bank { fill: #7ec8c8; opacity: 0.55; }
      .river-path { fill: none; stroke: #3d6b8a; stroke-width: 12; stroke-linejoin: round; }
      .hall-base { fill: #f7f1e4; stroke: #c4b59a; stroke-width: 1.5; }
      .hall-roof { fill: #8d95a0; }
      .wood { fill: #6b5344; }
      .vat { fill: #6aa8a8; stroke: #4f7e7e; stroke-width: 2; }
      .rack { fill: #b7a48a; stroke: #8a7a66; }
      .fence { stroke: #8a7348; stroke-width: 3; stroke-dasharray: 6 3; }
      .ui-hud { fill: rgba(248, 242, 228, 0.95); stroke: #d9c9a8; stroke-width: 1; rx: 8px; }
      .ui-card { fill: rgba(248, 242, 228, 0.96); stroke: #c8b998; stroke-width: 1.5; rx: 8px; }
      .ui-subcard { fill: #fffaf0; stroke: #dfd2be; stroke-width: 1; rx: 6px; }
      .ui-btn { fill: #fffaf0; stroke: #cbba9e; stroke-width: 1; rx: 4px; }
      .ui-btn-pri { fill: #3b5d85; stroke: #2b4667; stroke-width: 1; rx: 4px; }
      .ui-badge { fill: #efe4cb; stroke: #cbba9e; stroke-width: 1; rx: 999px; }
      .text-title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #2c251e; }
      .text-body { font-family: system-ui, sans-serif; font-size: 12px; fill: #2c251e; }
      .text-muted { font-family: system-ui, sans-serif; font-size: 11px; fill: #6e5d4b; }
      .text-alert { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #8a2010; }
      .text-white { font-family: system-ui, sans-serif; font-size: 11px; fill: #ffffff; }
      .ann-tag { fill: #fff3cd; stroke: #856404; stroke-width: 1; rx: 3px; }
      .ann-txt { font-family: system-ui, sans-serif; font-size: 10px; font-weight: bold; fill: #856404; }
      .guideline { stroke: #d9534f; stroke-width: 1; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- 1. 背景與場景地景 (對齊水路實驗接受版幾何) -->
  <rect width="1280" height="720" class="bg"/>
  <path d="M0,180 C300,100 600,220 900,140 C1100,80 1200,120 1280,100 L1280,0 L0,0 Z" class="mountain-back"/>
  <path d="M0,320 C400,220 800,360 1100,280 C1200,250 1250,270 1280,260 L1280,720 L0,720 Z" class="mountain-front"/>

  <!-- 水溪與挑水石階路 -->
  <path d="M120,680 C260,620 400,560 550,500 C720,440 900,480 1080,410 L1090,440 C890,520 700,470 530,530 C380,590 240,650 100,720 Z" class="river-bank"/>
  <path d="M960,330 L840,380 L720,430 L600,490 L480,540 L360,590 L240,640 L160,690" class="river-path"/>

  <!-- 道館主建築與庭院 -->
  <rect x="940" y="200" width="280" height="180" class="hall-base"/>
  <polygon points="920,200 1080,140 1240,200" class="hall-roof"/>
  <rect x="1050" y="270" width="60" height="110" class="wood"/>

  <!-- 護欄與受損痕跡 -->
  <line x1="880" y1="260" x2="880" y2="390" class="fence"/>
  <line x1="875" y1="300" x2="885" y2="305" stroke="#b0483a" stroke-width="2"/>
  <text x="830" y="300" class="text-alert">損痕 1/3</text>

  <!-- 設施：水缸、藥架、石凳 -->
  <ellipse cx="980" cy="360" rx="26" ry="16" class="vat"/>
  <text x="965" y="364" class="text-white" font-weight="bold">水缸</text>
  <rect x="1040" y="340" width="30" height="40" class="rack"/>
  <text x="1042" y="364" font-size="10" fill="#fffaf0" font-weight="bold">藥架</text>
  <rect x="920" y="380" width="40" height="14" rx="3" fill="#b0a28a"/>
  <text x="926" y="391" font-size="9" fill="#2c251e">石凳</text>

  <!-- 野豬棲地 (上方偏左) -->
  <ellipse cx="780" cy="200" rx="36" ry="20" fill="#c4a574" opacity="0.6"/>
  <rect x="760" y="190" width="36" height="22" rx="6" fill="#705036"/>
  <circle cx="790" cy="198" r="3" fill="#ffe6e0"/>
  <text x="752" y="180" class="text-muted">🐗 野豬棲地（休息）</text>

  <!-- 人物 1：熟手（堂哥）在石凳休息 -->
  <rect x="930" y="365" width="18" height="26" rx="4" fill="#6a5280"/>
  <rect x="906" y="350" width="66" height="15" rx="3" fill="rgba(47,42,36,0.85)"/>
  <text x="912" y="361" class="text-white">熟手 Lv 3 · 歇息</text>

  <!-- 人物 2：主角挑水返程（位於視野中央偏左） -->
  <g transform="translate(560, 440)">
    <!-- 扁擔與水桶 -->
    <line x1="-28" y1="-20" x2="28" y2="-20" stroke="#8a6416" stroke-width="3"/>
    <rect x="-32" y="-18" width="10" height="14" rx="2" fill="#6aa8a8"/>
    <rect x="22" y="-18" width="10" height="14" rx="2" fill="#6aa8a8"/>
    <!-- 主角身體 (藍衣) -->
    <rect x="-10" y="-36" width="20" height="36" rx="4" fill="#3b5d85"/>
    <circle cx="0" cy="-44" r="8" fill="#e8c89b"/>
    <!-- 動作狀態標籤 (上方) -->
    <rect x="-42" y="-72" width="84" height="18" rx="4" fill="rgba(47,42,36,0.88)"/>
    <text x="-36" y="-59" class="text-white">挑水·回程 45%</text>
    <!-- 腳底名牌標籤 (下方) -->
    <rect x="-48" y="6" width="96" height="18" rx="4" fill="rgba(248,242,228,0.95)" stroke="#3b5d85"/>
    <text x="-42" y="19" font-size="11" font-weight="bold" fill="#3b5d85">主角 Lv 1 · 精力 46</text>
  </g>

  <!-- ==================== UI 覆蓋層 (LP-14 桌面佈局 1280x720) ==================== -->

  <!-- 頂部 HUD (O1 觀察優先：核心存量、倍率、時鐘、可見跟隨) -->
  <rect x="20" y="15" width="1240" height="48" class="ui-hud"/>
  <text x="36" y="44" class="text-title">宗門編年</text>
  <text x="108" y="44" class="text-muted">生活開發版 · 尚未存檔</text>
  <rect x="240" y="27" width="60" height="24" class="ui-btn"/>
  <text x="252" y="43" class="text-body">❚❚ 暫停</text>
  <rect x="310" y="27" width="70" height="24" class="ui-btn"/>
  <text x="320" y="43" class="text-body">1× 2× 4×</text>
  <rect x="390" y="27" width="50" height="24" class="ui-btn"/>
  <text x="400" y="43" class="text-body">重來</text>

  <!-- 核心資源 Chips -->
  <rect x="470" y="28" width="56" height="22" class="ui-badge"/>
  <text x="482" y="43" class="text-body">0:12</text>
  <rect x="536" y="28" width="96" height="22" class="ui-badge"/>
  <text x="546" y="43" class="text-body">水缸 3／8 擔</text>
  <rect x="642" y="28" width="96" height="22" class="ui-badge"/>
  <text x="652" y="43" class="text-body">藥架 0／8 份</text>
  <rect x="748" y="28" width="80" height="22" class="ui-badge"/>
  <text x="758" y="43" class="text-body">主角 Lv 1</text>
  <rect x="838" y="28" width="80" height="22" class="ui-badge"/>
  <text x="848" y="43" class="text-body">共挑 0 趟</text>

  <!-- 可見鏡頭控制按鈕 (O3 可見跟隨) -->
  <rect x="940" y="27" width="96" height="24" class="ui-btn-pri"/>
  <text x="952" y="43" class="text-white">🎥 跟隨中</text>
  <rect x="1046" y="27" width="70" height="24" class="ui-btn"/>
  <text x="1058" y="43" class="text-body">初始影子</text>
  <rect x="1126" y="27" width="56" height="24" class="ui-btn"/>
  <text x="1138" y="43" class="text-body">名冊</text>

  <!-- 左上方：院落近況 (O1 精簡可折疊摘要卡片) -->
  <!-- 狀態 A：預設精簡折疊狀態 (僅佔 ~28px 高度) -->
  <rect x="20" y="75" width="340" height="32" class="ui-card"/>
  <text x="32" y="96" class="text-body"><b>🐗 院落近況</b></text>
  <rect x="110" y="80" width="62" height="20" rx="3" fill="#ffe6e0" stroke="#d97443"/>
  <text x="115" y="94" font-size="10" font-weight="bold" fill="#8a2010">損痕 1／3</text>
  <rect x="180" y="80" width="78" height="20" rx="3" fill="#efe4cb" stroke="#cbba9e"/>
  <text x="185" y="94" font-size="10" fill="#2c251e">🐭 鼠群·平靜</text>
  <rect x="275" y="80" width="72" height="20" class="ui-btn"/>
  <text x="285" y="94" class="text-body">明細 ▾</text>

  <!-- 右側：人物小卡 (O2 工作因果、下一步、真實精力門檻、快捷指令、進階折疊) -->
  <rect x="980" y="75" width="280" height="520" class="ui-card"/>
  <!-- 人物小卡 Header -->
  <text x="996" y="105" class="text-title">梁丘（主角）<tspan font-size="12" fill="#6e5d4b"> 師弟</tspan></text>
  <rect x="996" y="115" width="130" height="20" rx="3" fill="#efe4cb"/>
  <text x="1002" y="129" class="text-muted"><b>腳力 Lv 1／3</b> (再 3 趟升 Lv 2)</text>

  <!-- 真實精力條 (附 30 / 80 門檻標籤刻度) -->
  <text x="996" y="154" class="text-body"><b>精力 46／100</b></text>
  <text x="1150" y="154" class="text-muted">每秒 −1</text>
  <rect x="996" y="162" width="248" height="8" rx="4" fill="#e8dcc2"/>
  <rect x="996" y="162" width="114" height="8" rx="4" fill="#4f9a5a"/>
  <!-- 門檻刻度 -->
  <line x1="1070" y1="160" x2="1070" y2="172" stroke="#2c251e" stroke-width="1.5"/>
  <text x="1062" y="182" font-size="9" fill="#8a4a1e">30 休息</text>
  <line x1="1194" y1="160" x2="1194" y2="172" stroke="#2c251e" stroke-width="1.5"/>
  <text x="1186" y="182" font-size="9" fill="#2f6d3a">80 復工</text>

  <!-- 工作專區 (job-card：突顯下一步與因果，O2 核心) -->
  <rect x="996" y="194" width="248" height="96" class="ui-subcard"/>
  <text x="1008" y="214" class="text-body"><b>目前工作：挑水</b></text>
  <text x="1150" y="214" class="text-muted">返程負重中</text>
  <rect x="1008" y="222" width="224" height="6" rx="3" fill="#e8dcc2"/>
  <rect x="1008" y="222" width="100" height="6" rx="3" fill="#3b5d85"/>
  <text x="1008" y="246" font-size="12" font-weight="bold" fill="#8a4a1e">下一步：交付後去石凳休息</text>
  <text x="1008" y="266" font-size="11" fill="#6e5d4b">狀態原因：精力低於 30 門檻，排定休整</text>
  <text x="1008" y="280" font-size="10" fill="#2b4667">回饋：負重返程每步強化腿力筋骨</text>

  <!-- 快捷指令列 (直覺介入) -->
  <text x="996" y="308" class="text-muted">快捷指令：</text>
  <rect x="996" y="316" width="56" height="24" class="ui-btn"/>
  <text x="1008" y="332" class="text-body">挑水</text>
  <rect x="1058" y="316" width="56" height="24" class="ui-btn"/>
  <text x="1070" y="332" class="text-body">採藥</text>
  <rect x="1120" y="316" width="80" height="24" class="ui-btn"/>
  <text x="1128" y="332" class="text-body">本趟後停工</text>

  <!-- 進階設定折疊區 (O3 進階按需：純 UI 折疊，零模型副作用) -->
  <rect x="996" y="354" width="248" height="26" class="ui-btn"/>
  <text x="1008" y="371" class="text-body">⚙ 進階設定（自主政策／掌法） ▾</text>
  <rect x="996" y="386" width="248" height="195" class="ui-subcard"/>
  <text x="1008" y="406" class="text-muted">自主護院：</text>
  <rect x="1170" y="394" width="60" height="18" class="ui-btn"/>
  <text x="1178" y="407" font-size="10" fill="#2c251e">未允許</text>
  <text x="1008" y="430" class="text-muted">自主整理：</text>
  <rect x="1170" y="418" width="60" height="18" class="ui-btn"/>
  <text x="1178" y="431" font-size="10" fill="#2c251e">未允許</text>
  <text x="1008" y="454" class="text-muted">自主清鼠：</text>
  <rect x="1170" y="442" width="60" height="18" class="ui-btn"/>
  <text x="1178" y="455" font-size="10" fill="#2c251e">未允許</text>
  <line x1="1008" y1="468" x2="1232" y2="468" stroke="#dfd2be" stroke-width="1"/>
  <text x="1008" y="486" class="text-muted">掌法 fixture：</text>
  <rect x="1080" y="474" width="46" height="18" class="ui-btn-pri"/>
  <text x="1088" y="487" font-size="10" fill="#ffffff">初學</text>
  <rect x="1132" y="474" width="46" height="18" class="ui-btn"/>
  <text x="1140" y="487" font-size="10" fill="#2c251e">熟練</text>
  <text x="1008" y="512" font-size="10" fill="#6e5d4b">收穫累計：挑水 0 擔 · 採藥 0 份</text>
  <text x="1008" y="528" font-size="10" fill="#6e5d4b">空身速 7.5 · 負重速 4.2 單位/秒</text>
  <text x="1008" y="550" font-size="10" fill="#856404">[註] 折疊純屬 UI 狀態，不推進任何 tick</text>

  <!-- 底部：名冊列 (Roster) -->
  <rect x="20" y="660" width="360" height="46" class="ui-card"/>
  <rect x="26" y="665" width="168" height="36" rx="6" fill="#fffaf0" stroke="#8a6416" stroke-width="1.5"/>
  <text x="34" y="682" font-size="11" font-weight="bold" fill="#2c251e">梁丘（主角）· Lv 1</text>
  <text x="34" y="695" font-size="10" fill="#6e5d4b">精力 46 · 挑水 · 回程負重</text>
  <rect x="200" y="665" width="168" height="36" rx="6" fill="#fffaf0" stroke="#cbba9e"/>
  <text x="208" y="682" font-size="11" fill="#2c251e">仲遠（熟手）· Lv 3</text>
  <text x="208" y="695" font-size="10" fill="#6e5d4b">精力 80 · 挑水 · 石凳休息</text>

  <!-- ==================== 設計標註與規格對照 (LP14-A) ==================== -->
  <g transform="translate(20, 600)">
    <rect width="660" height="50" class="ann-tag"/>
    <text x="12" y="18" class="ann-txt">LP14-A 桌面生活觀察概念線框示意 (1280×720，非真實截圖)</text>
    <text x="12" y="32" font-size="10" fill="#533f03">真實截圖與標註請參見 desktop-annotated.svg ｜ Base dev: fd87f6751e2b2afd6521673d83b80798cac623a7</text>
    <text x="12" y="44" font-size="10" fill="#533f03">規格對應：O1 觀察優先 (HUD 精簡/近況折疊) ｜ O2 人物因果小卡 ｜ O3 進階純 UI 折疊與可見跟隨 ｜ O4 零模型改動</text>
  </g>
</svg>