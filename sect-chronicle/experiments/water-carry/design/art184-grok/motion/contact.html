<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>關鍵幀聯絡表</title>
<style>
  body { margin: 0; background: #f6f1e6; color: #2f2a24; font: 15px/1.4 "PingFang TC", "Noto Sans TC", sans-serif; }
  main { width: 1200px; padding: 24px 28px 36px; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  figure { margin: 0; background: #fff; border: 1px solid #cdbb98; }
  img { width: 100%; height: 220px; object-fit: contain; background: #efe6d4; display: block; }
  figcaption { padding: 6px 8px; }
</style>
</head>
<body>
<main>
  <h1>關鍵幀 · 美術預演，未連遊戲</h1>
  <p>從兩段 6 秒原地循環抽出。主角扁擔與兩桶一直在肩上；熟手空手。步態有差別，但人在畫面裡的位置會漂，不能按格裁成現有 190×214 幀。</p>
  <div class="grid">
    <figure><img src="frames/novice-plant.png" alt=""><figcaption>主角 · 著地。前腳踏出，扁擔略斜。</figcaption></figure>
    <figure><img src="frames/novice-pass.png" alt=""><figcaption>主角 · 通過。身體仍前傾，步子短。</figcaption></figure>
    <figure><img src="frames/novice-lift.png" alt=""><figcaption>主角 · 後腳抬起。桶仍掛在繩上。</figcaption></figure>
    <figure><img src="frames/skilled-idle.png" alt=""><figcaption>熟手 · 待機。上身直，雙腳靠近。</figcaption></figure>
    <figure><img src="frames/skilled-stride.png" alt=""><figcaption>熟手 · 開步。步幅比主角長。</figcaption></figure>
    <figure><img src="frames/skilled-pass.png" alt=""><figcaption>熟手 · 再一步。頭與肩的起伏較小。</figcaption></figure>
  </div>
</main>
</body>
</html>
