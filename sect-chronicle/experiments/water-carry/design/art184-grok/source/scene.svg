<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>同鏡頭生活場景候選</title>
  <desc>座標沿 spikes/shared/scene.json 與 demo/routes.mjs。概念圖，未連遊戲。遠林與雲是裝飾，不表示可走。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e4"/>
      <stop offset="0.55" stop-color="#d5e4df"/>
      <stop offset="1" stop-color="#b7d0c6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5e2b4"/>
      <stop offset="0.45" stop-color="#b7cf8b"/>
      <stop offset="1" stop-color="#8eaf62"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0d4"/>
      <stop offset="1" stop-color="#3f7f92"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7580"/>
      <stop offset="1" stop-color="#3c4650"/>
