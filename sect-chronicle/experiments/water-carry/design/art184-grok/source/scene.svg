    <path d="M80 210 Q180 180 280 210" stroke-width="18"/>
    <path d="M420 160 Q560 120 700 168" stroke-width="22"/>
  </g>
  <g fill="#e7eeea">
    <path d="M0 250 L120 190 L230 240 L360 170 L520 230 L640 180 L760 240 L900 190 L1040 250 L1040 340 L0 360 Z"/>
  </g>
  <g fill="#c5d4cf">
