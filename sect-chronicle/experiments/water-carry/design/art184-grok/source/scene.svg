    <ellipse cx="900" cy="568" rx="16" ry="7"/>
    <ellipse cx="850" cy="612" rx="17" ry="8"/>
    <ellipse cx="760" cy="628" rx="18" ry="8"/>
    <ellipse cx="690" cy="618" rx="16" ry="7"/>
    <ellipse cx="600" cy="640" rx="18" ry="8"/>
    <ellipse cx="520" cy="676" rx="18" ry="8"/>
    <ellipse cx="440" cy="694" rx="16" ry="7"/>
    <ellipse cx="390" cy="702" rx="15" ry="7"/>
