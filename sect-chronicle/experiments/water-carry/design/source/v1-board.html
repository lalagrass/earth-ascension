<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>挑水切片 V1 畫面稿</title>
<!--
  SG-EXP-01 V1 可編輯來源（#155）。
  純 HTML／CSS＋inline SVG，沒有外部圖片或字型檔；全部圖形由下方 script 的函式畫出，
  兩張完整畫面、人物動作表與場景／UI 元件表共用同一組函式，所以比例、配色與造型一致。
  開法：直接用瀏覽器開本檔，或加 ?board=observe|intervene|characters|sceneui 只看一張。
  輸出 PNG：node ../render.js（見 ../V1.md）。
-->
<style>
  :root {
    --ink: #2f2a24; --ink2: #6b6254; --paper: #f6efe0; --paper2: #efe4cc; --line: #cdbb98;
    --gold: #c8962e; --gold2: #f3dfae; --red: #a33b2a; --jade: #3f7d6e; --water: #4f93b0;
    --hero: #4f78a8; --master: #6c5a8e; --senior: #b07a3a; --muted: #9a907f; --off: #b8ad99;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "WenQuanYi Zen Hei", sans-serif;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Zen Hei", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d2c3; color: var(--ink); font-family: var(--font); }
  .board { position: relative; width: 1600px; height: 900px; overflow: hidden; margin: 0 auto 40px; background: var(--paper); }
  .board.tall { height: 1000px; }
  .board > svg.scene { position: absolute; inset: 0; }
  body.single .board { margin: 0; }

  /* HUD */
  .hud { position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; gap: 14px;
    padding: 0 18px; background: rgba(246,239,224,.93); border-bottom: 1px solid var(--line); font-size: 15px; }
  .hud .title { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  .hud .sub { font-size: 12px; color: var(--ink2); border: 1px dashed var(--line); padding: 1px 6px; border-radius: 4px; }
  .clock { display: flex; flex-direction: column; gap: 4px; min-width: 132px; }
  .clock b { font-size: 16px; }
  .daybar { height: 4px; background: #e2d6bd; border-radius: 2px; overflow: hidden; }
  .daybar i { display: block; height: 100%; background: var(--gold); }
  .btn { border: 1px solid var(--line); background: #fffaf0; border-radius: 6px; padding: 5px 11px; font-size: 14px; color: var(--ink); white-space: nowrap; }
  .btn.on { background: #8f4a2a; color: #fff6e6; border-color: #8f4a2a; }
  .btn.play { font-weight: 700; }
  .btn.paused { background: #fff3cf; border-color: var(--gold); }
  .chip { border-radius: 14px; padding: 3px 10px; font-size: 13px; background: #ece2cc; white-space: nowrap; }
  .chip.water { background: #d5e8ee; color: #23566b; }
  .chip.leg { background: #e6ddf0; color: #4a3d68; }
  .spacer { flex: 1; }
  .kbd { font-size: 11px; color: var(--ink2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 4px; background: #fff; }

  /* roster */
  .roster { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; display: flex; gap: 12px; align-items: center;
    padding: 0 18px; background: rgba(246,239,224,.95); border-top: 1px solid var(--line); }
  .card { width: 268px; height: 80px; border: 1px solid var(--line); border-radius: 10px; background: #fffaf0; display: flex; gap: 10px; padding: 9px 11px; align-items: flex-start; position: relative; }
  .card.sel { border: 2px solid var(--gold); box-shadow: 0 0 0 3px rgba(200,150,46,.22); background: #fff8e8; }
  .ava { width: 40px; height: 40px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
  .card .nm { font-weight: 700; font-size: 15px; }
  .card .st { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .card .st b { color: var(--ink); font-weight: 600; }
  .bars { display: flex; gap: 5px; margin-top: 7px; }
  .bars i { display: block; height: 5px; border-radius: 3px; background: #e5dccb; width: 56px; position: relative; overflow: hidden; }
  .bars i::after { content: ""; position: absolute; inset: 0; width: var(--v); background: var(--c); }
  .badge { position: absolute; right: 8px; top: 8px; font-size: 11px; border-radius: 9px; padding: 1px 7px; background: #fff3cf; border: 1px solid var(--gold); color: #7a5a14; }
  .roster .more { margin-left: auto; }

  /* in-scene labels */
  .tag { position: absolute; transform: translate(-50%, 0); font-size: 12px; background: rgba(255,250,240,.92); border: 1px solid var(--line);
    border-radius: 9px; padding: 0 7px; white-space: nowrap; }
  .tag.hero { border-color: var(--hero); color: #23436a; font-weight: 700; }
  .tag.sel { border: 2px solid var(--gold); background: #fff6dc; font-size: 13px; padding: 1px 9px; }
  .tag.place { font-family: var(--serif); font-size: 14px; font-weight: 700; background: rgba(47,42,36,.72); color: #fff3d8; border: 0; border-radius: 4px; padding: 1px 8px; }
  .tag.ghost { opacity: .85; border-style: dashed; color: var(--ink2); font-size: 11px; }
  .pill { position: absolute; transform: translate(-50%, 0); font-size: 12px; background: #2f2a24; color: #fff3d8; border-radius: 10px; padding: 2px 9px 2px 6px; white-space: nowrap; display: flex; gap: 5px; align-items: center; }
  .pill .ring { width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(#f0c35a var(--p), #5a5146 0); display: grid; place-items: center; }
  .pill .ring::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2f2a24; }
  .float { position: absolute; transform: translate(-50%, 0); font-weight: 700; font-size: 15px; color: #23566b; text-shadow: 0 1px 0 #fff, 0 0 4px #fff; }
  .float.gold { color: #8a5e10; }

  /* drawers / panels */
  .drawer { position: absolute; right: 16px; top: 74px; display: flex; gap: 8px; }
  .feed { position: absolute; left: 16px; top: 74px; width: 290px; font-size: 13px; background: rgba(255,250,240,.88); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .feed div { padding: 2px 0; color: var(--ink2); }
  .feed div b { color: var(--ink); font-weight: 600; }
  .feed .t { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .hint { position: absolute; left: 50%; bottom: 116px; transform: translateX(-50%); font-size: 13px; background: rgba(47,42,36,.78); color: #fff3d8; padding: 4px 12px; border-radius: 12px; white-space: nowrap; }

  .banner { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); background: #fff3cf; border: 1px solid var(--gold); color: #6b4b0c; font-weight: 700; padding: 6px 16px; border-radius: 18px; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  .menu { position: absolute; width: 300px; background: #fffaf0; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(47,42,36,.22); padding: 12px; font-size: 14px; }
  .menu h3 { margin: 0; font-family: var(--serif); font-size: 18px; display: flex; justify-content: space-between; align-items: baseline; }
  .menu h3 small { font-family: var(--font); font-size: 12px; color: var(--ink2); font-weight: 400; }
  .menu .desc { color: var(--ink2); font-size: 12px; margin: 4px 0 8px; }
  .menu .who { font-size: 12px; background: #eef3f8; color: #23436a; border-radius: 6px; padding: 4px 8px; margin-bottom: 8px; }
  .opt { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; margin-top: 6px; background: #fff; }
  .opt b { display: block; font-size: 14px; }
  .opt span { font-size: 12px; color: var(--ink2); }
  .opt.hover { border: 2px solid var(--gold); background: #fff6dc; }
  .opt.off { background: #f3eee4; color: var(--off); border-style: dashed; }
  .opt.off b { color: #a59a86; }
  .opt.off span { color: #a33b2a; }
  .menu .foot { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
  .waterbar { height: 8px; border-radius: 4px; background: #e2ddd2; overflow: hidden; margin: 6px 0 2px; }
  .waterbar i { display: block; height: 100%; background: linear-gradient(90deg, #6fb3cb, #3f87a6); }

  .panel { position: absolute; right: 16px; top: 74px; width: 360px; bottom: 116px; background: rgba(255,250,240,.97); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 14px; box-shadow: 0 6px 18px rgba(47,42,36,.14); }
  .panel h2 { margin: 0; font-family: var(--serif); font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .panel h2 .ava { width: 34px; height: 34px; font-size: 13px; }
  .panel h2 small { font-family: var(--font); font-size: 12px; color: var(--ink2); font-weight: 400; }
  .panel h4 { margin: 14px 0 6px; font-size: 13px; color: var(--ink2); font-weight: 600; letter-spacing: 1px; }
  .work { border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: #fff; }
  .work .now { font-size: 16px; font-weight: 700; }
  .stages { display: flex; gap: 4px; margin: 9px 0 6px; }
  .stages div { flex: 1; text-align: center; font-size: 12px; padding: 4px 0; border-radius: 5px; background: #efe8da; color: var(--ink2); }
  .stages div.done { background: #dbe7d6; color: #355d2b; }
  .stages div.cur { background: var(--hero); color: #fff; font-weight: 700; }
  .prog { height: 6px; border-radius: 3px; background: #e5dccb; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--hero); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; margin-top: 8px; }
  .kv span:nth-child(odd) { color: var(--ink2); }
  .kv b { font-weight: 700; }
  .leg { display: flex; align-items: center; gap: 8px; }
  .leg .lv { font-size: 22px; font-weight: 800; color: #4a3d68; font-family: var(--serif); }
  .leg .bar { flex: 1; height: 8px; border-radius: 4px; background: #e6ddf0; overflow: hidden; }
  .leg .bar i { display: block; height: 100%; background: #7a64a6; }
  .speed { display: flex; align-items: flex-end; gap: 6px; margin-top: 10px; }
  .speed div { flex: 1; text-align: center; font-size: 11px; color: var(--ink2); }
  .speed div i { display: block; margin: 0 auto 3px; width: 70%; border-radius: 3px 3px 0 0; background: #c9bfdc; }
  .speed div.me i { background: #7a64a6; }
  .speed div.cap i { background: repeating-linear-gradient(45deg,#e6ddf0 0 4px,#d4c8e6 4px 8px); }
  .pending { margin-top: 6px; border: 2px solid var(--gold); background: #fff6dc; border-radius: 9px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pending b { display: block; }
  .pending span { font-size: 12px; color: #7a5a14; }
  .note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .toast { position: absolute; background: #2f2a24; color: #fff3d8; border-radius: 8px; padding: 6px 12px; font-size: 13px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .toast b { color: #f0c35a; }

  .call { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #a33b2a; color: #fff; font-weight: 800; font-size: 14px;
    display: grid; place-items: center; box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.3); }
  .flow { position: absolute; left: 16px; top: 74px; background: rgba(255,250,240,.95); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; width: 300px; }
  .flow b { font-size: 12px; color: var(--ink2); letter-spacing: 1px; }
  .flow ol { margin: 4px 0 0; padding: 0; list-style: none; }
  .flow li { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  .flow li i { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #a33b2a; color: #fff; font-style: normal; font-size: 11px; font-weight: 800; display: grid; place-items: center; }

  /* sheets */
  .sheet { padding: 22px 30px; }
  .sheet h1 { margin: 0 0 2px; font-family: var(--serif); font-size: 26px; }
  .sheet .lead { color: var(--ink2); font-size: 13px; margin-bottom: 10px; }
  .sheet h3 { margin: 0; font-size: 15px; }
  .sheet .cap { font-size: 12px; color: var(--ink2); line-height: 1.5; }
  .abs { position: absolute; }
  .sw { display: inline-flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--ink2); margin-right: 8px; }
  .sw i { width: 44px; height: 30px; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); margin-bottom: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- palette ---------- */
const C = {
  ink: '#2f2a24', paper: '#f6efe0', line: '#cdbb98', gold: '#c8962e',
  water: '#4f93b0', waterLight: '#a9d4e2', waterDeep: '#2f6f8c',
  grass: '#a7b878', grass2: '#8ea463', grass3: '#748c4e', earth: '#d8c8a2', earthEdge: '#b9a77f',
  stone: '#bdb6a6', stone2: '#9d968a', stone3: '#7c766b',
  roof: '#4b5662', roof2: '#363f49', wall: '#f1e8d4', wall2: '#dcd0b8', pillar: '#8c3a2b',
  wood: '#93683f', wood2: '#62452a', band: '#4d4a46',
  pine: '#4f6e4a', pine2: '#3c5739', pine3: '#6e8b5c', trunk: '#6b4a32',
  skin: '#f0d2b0', skin2: '#ddb48f', hair: '#2b2522',
  hero: '#4f78a8', hero2: '#3b5d85', heroSash: '#e7d9b8',
  master: '#6c5a8e', master2: '#52446d', senior: '#b07a3a', senior2: '#8a5c27',
  trousers: '#e9e0cc', shoe: '#3a332c'
};

/* ---------- geometry helpers ---------- */
const rad = d => d * Math.PI / 180;
const f = n => Math.round(n * 10) / 10;
const pt = (x, y) => `${f(x)},${f(y)}`;
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const rot = (v, deg) => { const r = rad(deg); return [v[0] * Math.cos(r) - v[1] * Math.sin(r), v[0] * Math.sin(r) + v[1] * Math.cos(r)]; };
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

/* ---------- bucket: (0,0) = handle top / rope point ---------- */
function bucket(x, y, deg, fill, s = 1, extra = '') {
  const water = fill > 0
    ? `<ellipse cx="0" cy="10" rx="7.2" ry="2.1" fill="${C.water}"/><ellipse cx="-2" cy="9.6" rx="3" ry=".8" fill="${C.waterLight}"/>`
    : `<ellipse cx="0" cy="10" rx="7.2" ry="2.1" fill="${C.wood2}"/>`;
  return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)}) scale(${s})" ${extra}>
    <path d="M-8.5,9 Q0,-4 8.5,9" fill="none" stroke="${C.band}" stroke-width="1.3"/>
    <path d="M-8,10 L-6.6,24 Q0,26 6.6,24 L8,10 Z" fill="${C.wood}" stroke="${C.wood2}" stroke-width="1"/>
    <path d="M-3,10.5 L-2.6,25 M3,10.5 L2.6,25" stroke="${C.wood2}" stroke-width=".6" opacity=".6"/>
    <path d="M-7.6,14 Q0,16 7.6,14 M-7,21 Q0,23 7,21" fill="none" stroke="${C.band}" stroke-width="1.4"/>
    <ellipse cx="0" cy="10" rx="8" ry="2.6" fill="none" stroke="${C.wood2}" stroke-width="1"/>
    ${water}
  </g>`;
}

/* ---------- character ----------
   local coords: x forward, y down, origin = ground point under hips.
   legs: [{t: thigh angle from vertical (forward +), k: knee bend}], front leg first.
   load: 'pole' (扁擔+兩桶) | 'dip' (取水) | 'pour' (倒水) | 'none' */
function figure(o) {
  const d = Object.assign({ x: 0, y: 0, s: 1, dir: 1, back: false, lean: 0, bob: 0,
    legs: [{ t: 4, k: 0 }, { t: -4, k: 0 }], load: 'pole', fill: 0, swing: 0, poleTilt: 0, sag: 0,
    robe: C.hero, robe2: C.hero2, sash: C.heroSash, opacity: 1, glow: null, freeArm: false,
    broom: false, sit: false }, o);
  const TH = 21, SH = 21;
  // legs relative to hip
  const legPts = d.legs.map(l => {
    const knee = [TH * Math.sin(rad(l.t)), TH * Math.cos(rad(l.t))];
    const sa = l.t - l.k;
    const foot = add(knee, [SH * Math.sin(rad(sa)), SH * Math.cos(rad(sa))]);
    return { knee, foot, sa };
  });
  let low = 0;
  legPts.forEach(p => { low = Math.max(low, p.foot[1] + 2, p.knee[1] + 3); });
  if (d.sit) low = 12;
  const hip = [0, -low + d.bob];
  const L = d.lean;
  const up = [Math.sin(rad(L)), -Math.cos(rad(L))];
  const along = (base, k) => [base[0] + up[0] * k, base[1] + up[1] * k];
  const sh = along(hip, 30), neck = along(hip, 34), head = along(hip, 44);
  const perp = [Math.cos(rad(L)), Math.sin(rad(L))];
  const P = (base, k) => [base[0] + perp[0] * k, base[1] + perp[1] * k];

  let back = '', front = '', body = '';
  // legs (back leg first)
  const legSvg = (lp, shade) => {
    const k = add(hip, lp.knee), ft = add(hip, lp.foot);
    const toe = rot([6, 0], 0);
    return `<path d="M${pt(...hip)} L${pt(...k)} L${pt(...ft)}" fill="none" stroke="${shade ? '#d3c8b0' : C.trousers}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M${pt(ft[0] - 3, ft[1] - 1.5)} q2,-2.5 6,-1 l3.5,2.5 l-9.5,0 z" fill="${C.shoe}"/>`;
  };
  if (d.sit) {
    back += `<ellipse cx="${f(hip[0])}" cy="${f(hip[1] + 9)}" rx="17" ry="5" fill="${d.robe2}"/>`;
  } else {
    back += legSvg(legPts[1], true);
    front += legSvg(legPts[0], false);
  }
  // robe
  const hemY = hip[1] + (d.sit ? 9 : 15);
  const robe = `<path d="M${pt(...P(sh, -8.5))} L${pt(...P(sh, 8))} Q${pt(...P(along(hip, 12), 10))} ${pt(hip[0] + 15, hemY)}
     L${pt(hip[0] - 13, hemY + 1)} Q${pt(...P(along(hip, 10), -11))} ${pt(...P(sh, -8.5))} Z" fill="${d.robe}" stroke="${d.robe2}" stroke-width="1.2"/>
     <path d="M${pt(...P(sh, 2))} L${pt(...P(along(hip, 14), 6))}" stroke="${d.sash}" stroke-width="2" fill="none" opacity="${d.back ? 0 : .9}"/>
     <path d="M${pt(...P(along(hip, 3), -10.5))} L${pt(...P(along(hip, 3), 11))}" stroke="${d.sash}" stroke-width="3.2"/>
     ${d.back ? `<path d="M${pt(...P(along(hip, 3), -10))} l-5,7 m5,-7 l-1,8" stroke="${d.sash}" stroke-width="2" fill="none"/>` : ''}`;
  // head
  const hx = head[0], hy = head[1];
  const face = d.back
    ? `<circle cx="${f(hx)}" cy="${f(hy)}" r="9.6" fill="${C.hair}"/><circle cx="${f(hx - 1)}" cy="${f(hy - 10)}" r="4.2" fill="${C.hair}"/>
       <ellipse cx="${f(hx + 6.5)}" cy="${f(hy + 2)}" rx="2" ry="3" fill="${C.skin2}"/>`
    : `<circle cx="${f(hx)}" cy="${f(hy)}" r="9.6" fill="${C.skin}"/>
       <path d="M${pt(hx - 9.8, hy + 2)} Q${pt(hx - 10, hy - 10)} ${pt(hx + 1, hy - 10.2)} Q${pt(hx + 9, hy - 9)} ${pt(hx + 9.6, hy - 3)} Q${pt(hx + 2, hy - 6)} ${pt(hx - 3, hy - 3)} L${pt(hx - 4, hy + 4)} Z" fill="${C.hair}"/>
       <circle cx="${f(hx - 4)}" cy="${f(hy - 11)}" r="4" fill="${C.hair}"/>
       <circle cx="${f(hx + 5)}" cy="${f(hy + 0.5)}" r="1.15" fill="${C.ink}"/>
       <path d="M${pt(hx + 4, hy + 5)} q2,1 3.4,-.4" stroke="#a5654a" stroke-width=".9" fill="none"/>
       <circle cx="${f(hx + 2.5)}" cy="${f(hy + 3.5)}" r="1.8" fill="#f2a98f" opacity=".45"/>`;
  const neckSvg = `<path d="M${pt(...sh)} L${pt(...neck)}" stroke="${C.skin2}" stroke-width="5"/>`;

  // arms & load
  const arm = (el, hand, color) => `<path d="M${pt(...sh)} L${pt(...el)} L${pt(...hand)}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
     <circle cx="${f(hand[0])}" cy="${f(hand[1])}" r="2.7" fill="${C.skin}"/>`;
  let loadBack = '', loadFront = '';
  if (d.load === 'pole') {
    const c = add(sh, [0, -3]);
    const pa = d.poleTilt;
    const e1 = add(c, rot([40, 0], pa)), e2 = add(c, rot([-40, 0], pa));
    const sag = 1.5 + d.fill * 3.5 + d.sag;
    const pole = `<path d="M${pt(e2[0], e2[1] + sag)} Q${pt(c[0], c[1] - 1.5)} ${pt(e1[0], e1[1] + sag)}" fill="none" stroke="${C.wood}" stroke-width="3.2" stroke-linecap="round"/>`;
    const hang = (e, sw) => {
      const top = [e[0], e[1] + sag];
      const end = add(top, rot([0, 24], sw));
      return `<path d="M${pt(...top)} L${pt(...end)}" stroke="#7b6a52" stroke-width="1"/>` + bucket(end[0], end[1], sw, d.fill);
    };
    loadBack += hang(e2, d.swing * 0.8);
    loadFront += pole + hang(e1, d.swing);
    const pf = add(c, rot([15, 0], pa)), pb = add(c, rot([-13, 0], pa));
    back += arm(add(sh, [-6, 9]), d.freeArm ? add(sh, [-10, 22]) : [pb[0], pb[1] + 1], d.robe2);
    loadFront += arm(add(sh, [9, 9]), [pf[0], pf[1] + 1], d.robe);
  } else if (d.load === 'dip') {
    const b = d.bucketAt || [30, -14];
    loadFront += bucket(b[0], b[1], d.bucketRot || 18, d.fill);
    back += arm(add(sh, [6, 12]), [b[0] - 1, b[1] + 1], d.robe2);
    loadFront += arm(add(sh, [12, 10]), [b[0] + 2, b[1] + 2], d.robe);
    if (d.poleDown) back = `<path d="M-46,-2 L22,-3" stroke="${C.wood}" stroke-width="3.2" stroke-linecap="round"/>` + bucket(-40, -27, 0, 1, 1) + back;
  } else if (d.load === 'pour') {
    const b = d.bucketAt || [24, -66];
    loadFront += bucket(b[0], b[1], d.bucketRot || 78, 1);
    back += arm(add(sh, [6, 10]), [b[0] - 4, b[1] + 3], d.robe2);
    loadFront += arm(add(sh, [13, 2]), [b[0] + 4, b[1] - 3], d.robe);
    if (d.stream) loadFront += `<path d="M${pt(b[0] + 23, b[1] + 6)} q12,4 10,${d.stream}" stroke="${C.water}" stroke-width="4.5" fill="none" stroke-linecap="round" opacity=".9"/>
      <path d="M${pt(b[0] + 23, b[1] + 6)} q11,4 9,${d.stream}" stroke="${C.waterLight}" stroke-width="1.4" fill="none" opacity=".9"/>`;
  } else if (d.broom) {
    const h1 = add(sh, [14, 16]), h2 = add(sh, [6, 22]);
    loadFront += `<path d="M${pt(h1[0] - 4, h1[1] - 10)} L${pt(h1[0] + 18, h1[1] + 40)}" stroke="${C.wood}" stroke-width="2.4"/>
      <path d="M${pt(h1[0] + 14, h1[1] + 36)} l14,10 l-12,4 z" fill="#c7a86a"/>`;
    back += arm(add(sh, [5, 12]), h2, d.robe2);
    loadFront += arm(add(sh, [10, 10]), h1, d.robe);
  } else if (d.sit) {
    const hl = add(hip, [6, -4]);
    loadFront += arm(add(sh, [9, 12]), hl, d.robe);
  } else {
    back += arm(add(sh, [-3, 13]), add(sh, [-2, 25]), d.robe2);
    loadFront += arm(add(sh, [4, 13]), add(sh, [5, 25]), d.robe);
  }
  const inner = `${loadBack}${back}${front}${robe}${neckSvg}${face}${loadFront}`;
  const glow = d.glow ? `<g stroke="${d.glow}" stroke-width="5" stroke-linejoin="round" opacity=".9" style="filter:blur(.6px)">${inner.replace(/fill="[^"]*"/g, `fill="${d.glow}"`)}</g>` : '';
  return `<g transform="translate(${f(d.x)},${f(d.y)}) scale(${f(d.s * d.dir)},${f(d.s)})" opacity="${d.opacity}">${glow}${inner}</g>`;
}

/* ---------- path ---------- */
const PATH = [[962, 512], [872, 540], [918, 592], [790, 636], [662, 612], [556, 656], [440, 694], [376, 702]];
function pathAt(t) {
  const segs = []; let total = 0;
  for (let i = 1; i < PATH.length; i++) { const l = Math.hypot(PATH[i][0] - PATH[i - 1][0], PATH[i][1] - PATH[i - 1][1]); segs.push(l); total += l; }
  let r = t * total;
  for (let i = 0; i < segs.length; i++) {
    if (r <= segs[i] || i === segs.length - 1) { const k = Math.min(1, r / segs[i]); const p = lerp(PATH[i], PATH[i + 1], k);
      return { x: p[0], y: p[1], dx: PATH[i + 1][0] - PATH[i][0] }; }
    r -= segs[i];
  }
}
function pathSvg(routeFrom, routeTo) {
  const d = 'M' + PATH.map(p => pt(...p)).join(' L');
  let steps = '';
  for (let t = 0.02; t < 0.98; t += 0.03) {
    const a = pathAt(t), b = pathAt(t + 0.004);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2;
    const ox = Math.cos(ang) * 12, oy = Math.sin(ang) * 12 * 0.6;
    steps += `<path d="M${pt(a.x - ox, a.y - oy)} L${pt(a.x + ox, a.y + oy)}" stroke="${C.earthEdge}" stroke-width="1.6" opacity=".7"/>`;
  }
  let route = '';
  if (routeFrom != null) {
    let pts = []; for (let t = routeFrom; routeFrom > routeTo ? t >= routeTo : t <= routeTo; t += routeFrom > routeTo ? -0.01 : 0.01) { const p = pathAt(t); pts.push(pt(p.x, p.y - 2)); }
    route = `<path d="M${pts.join(' L')}" fill="none" stroke="${C.gold}" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>`;
  }
  return `<path d="${d}" fill="none" stroke="#9c8b67" stroke-width="36" stroke-linejoin="round" stroke-linecap="round" opacity=".35"/>
    <path d="${d}" fill="none" stroke="${C.earth}" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#e6d8b6" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity=".6"/>
    ${steps}${route}`;
}
