<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>挑水山路 BL-V03 改後畫面稿</title>
<!--
  BL-V03 第 1 步可編輯來源（#177）：挑水山路與主角造型的「改後」方向。
  純 HTML／CSS＋inline SVG，沒有外部圖片或字型檔；全部圖形由下方 script 的函式畫出。
  地點、路徑點、人物站位與 V1／V3 相同（PATH、水缸、泉水、道館、師父、師兄），只換畫法，所以可以和 V3 現況逐格比較。
  「改前」不在本檔重畫：輸出時由 ../render-bl-v03.js 從 v1-board.html 取原函式的 SVG 填進 window.BEFORE。
  開法：直接用瀏覽器開本檔，加 ?board=after 只看改後場景；compare／hero 兩張需要 render 腳本提供改前資料。
-->
<style>
  :root {
    --ink: #2f2a24; --ink2: #6b6254; --paper: #f6efe0; --line: #cdbb98; --gold: #c8962e; --hero: #4f78a8;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "WenQuanYi Zen Hei", sans-serif;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Zen Hei", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d2c3; color: var(--ink); font-family: var(--font); }
  .board { position: relative; width: 1600px; height: 900px; overflow: hidden; margin: 0 auto 40px; background: var(--paper); }
  .board.tall { height: 1000px; }
  .board > svg { position: absolute; inset: 0; }
  body.single .board { margin: 0; }
  .tag { position: absolute; transform: translate(-50%, 0); white-space: nowrap; font-size: 12px; padding: 0 6px; border-radius: 4px;
    background: rgba(248, 242, 228, .9); border: 1px solid var(--line); }
  .tag.place { font-weight: 700; transform: translate(-50%, -100%); }
  .tag.hero { background: var(--hero); color: #fff; border-color: #3b5d85; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- palette（光從左上來；暖光、冷影） ---------- */
const C = {
  ink: '#2f2a24', line: '#cdbb98', gold: '#c8962e',
  water: '#4d97b8', waterLight: '#b5e0ec', waterDeep: '#2a6a88', foam: '#eef8fa',
  grassLit: '#c3cf8f', grass: '#a9bb77', grass2: '#8fa45f', grass3: '#6f8a4a', grassDark: '#557040',
  earth: '#dccba3', earthEdge: '#b49f76',
  slab: '#cfc6b3', slabLit: '#e7e0d0', slabDark: '#a59c88', slabEdge: '#857c6b',
  stone: '#bdb6a6', stone2: '#9d968a', stone3: '#7a7468', moss: '#7d9a52',
  roof: '#4b5662', roof2: '#363f49', roofLit: '#6b7783', wall: '#f3ebd8', wall2: '#ddd1b8', pillar: '#8f3a2b', pillarLit: '#b04a36',
  wood: '#9a6d42', wood2: '#62452a', woodLit: '#c08e5c', band: '#4d4a46',
  pine: '#4f6e4a', pine2: '#3a5538', pineLit: '#6f9061', trunk: '#6b4a32',
  maple: '#c8643a', maple2: '#a84a2c', mapleLit: '#e79a5a', plum: '#f2c4cf', plum2: '#e59fb2',
  skin: '#f4d6b6', skin2: '#e0b690', blush: '#f19f8a', hair: '#2b2522', hairLit: '#4a403a',
  hero: '#5683b8', hero2: '#3d6593', heroLit: '#7aa3d1', heroInner: '#f5efe2', heroSash: '#e9d6a6', ribbon: '#d65a4a',
  master: '#6c5a8e', master2: '#52446d', masterLit: '#8a78ab', senior: '#b07a3a', senior2: '#8a5c27', seniorLit: '#cf9a5a',
  trousers: '#ece4d2', trousers2: '#d4cab4', wrap: '#b9ad94', shoe: '#3a332c'
};

/* ---------- 工具 ---------- */
const rad = d => d * Math.PI / 180;
const f = n => Math.round(n * 10) / 10;
const pt = (x, y) => `${f(x)},${f(y)}`;
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const rot = (v, deg) => { const r = rad(deg); return [v[0] * Math.cos(r) - v[1] * Math.sin(r), v[0] * Math.sin(r) + v[1] * Math.cos(r)]; };
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
// 固定亂數：同一份來源每次輸出完全相同
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- 木桶：(0,0) = 提把頂 ---------- */
function bucket(x, y, deg, fill, s = 1) {
  const top = fill > 0
    ? `<ellipse cx="0" cy="10" rx="7.4" ry="2.2" fill="${C.water}"/><ellipse cx="-2.4" cy="9.6" rx="3.2" ry=".8" fill="${C.waterLight}"/>`
    : `<ellipse cx="0" cy="10" rx="7.4" ry="2.2" fill="${C.wood2}"/>`;
  return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)}) scale(${s})">
    <path d="M-8.5,9 Q0,-5 8.5,9" fill="none" stroke="${C.band}" stroke-width="1.4"/>
    <path d="M-8.2,10 L-6.8,24 Q0,26.4 6.8,24 L8.2,10 Z" fill="${C.wood}" stroke="${C.wood2}" stroke-width="1"/>
    <path d="M-6.6,11 L-5.6,23.6" stroke="${C.woodLit}" stroke-width="2.2" opacity=".55"/>
    <path d="M3.4,10.8 L3,25 M-1,11 L-.9,25.6" stroke="${C.wood2}" stroke-width=".55" opacity=".55"/>
    <path d="M-7.8,14 Q0,16.2 7.8,14 M-7.1,21.2 Q0,23.4 7.1,21.2" fill="none" stroke="#3f3b37" stroke-width="1.5"/>
    <path d="M-7.6,14 Q-4,15.2 -1,15.5" fill="none" stroke="#8b867f" stroke-width=".7"/>
    <ellipse cx="0" cy="10" rx="8.2" ry="2.7" fill="none" stroke="${C.wood2}" stroke-width="1"/>
    ${top}
  </g>`;
}

/* ---------- 人物（改後）----------
   與 V1 相同的骨架與姿勢參數（大腿 21、小腿 21、腳底原點），所以 V1 的 POSE 表直接可用；
   只換外形：頭大一點、臉圓、身形圓潤（初學者，見 #170），交領內衫、寬腰帶打結、袖口、綁腿、髮髻與紅髮帶，
   左上光：前緣亮、背側暗。 */
function figure(o) {
  const d = Object.assign({ x: 0, y: 0, s: 1, dir: 1, back: false, lean: 0, bob: 0,
    legs: [{ t: 4, k: 0 }, { t: -4, k: 0 }], load: 'pole', fill: 0, swing: 0, poleTilt: 0, sag: 0,
    robe: C.hero, robe2: C.hero2, robeLit: C.heroLit, sash: C.heroSash, inner: C.heroInner, ribbon: C.ribbon,
    round: 1, opacity: 1, freeArm: false, broom: false, sit: false, beard: false }, o);
  const TH = 21, SH = 21, R = d.round;
  const legPts = d.legs.map(l => {
    const knee = [TH * Math.sin(rad(l.t)), TH * Math.cos(rad(l.t))];
    const sa = l.t - l.k;
    const foot = add(knee, [SH * Math.sin(rad(sa)), SH * Math.cos(rad(sa))]);
    return { knee, foot };
  });
  let low = 0;
  legPts.forEach(p => { low = Math.max(low, p.foot[1] + 2, p.knee[1] + 3); });
  if (d.sit) low = 12;
  const hip = [0, -low + d.bob];
  const L = d.lean;
  const up = [Math.sin(rad(L)), -Math.cos(rad(L))];
  const along = (base, k) => [base[0] + up[0] * k, base[1] + up[1] * k];
  const perp = [Math.cos(rad(L)), Math.sin(rad(L))];
  const P = (base, k) => [base[0] + perp[0] * k, base[1] + perp[1] * k];
  const sh = along(hip, 29), neck = along(hip, 32), head = along(hip, 43.5);

  let back = '', front = '';
  const leg = (lp, shade) => {
    const k = add(hip, lp.knee), ft = add(hip, lp.foot);
    const shin = lerp(k, ft, .62), shin2 = lerp(k, ft, .82);
    return `<path d="M${pt(...hip)} L${pt(...k)} L${pt(...ft)}" fill="none" stroke="${shade ? C.trousers2 : C.trousers}" stroke-width="${f(7.6 * Math.min(R, 1.15))}" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M${pt(...shin)} L${pt(...shin2)}" stroke="${C.wrap}" stroke-width="7" stroke-linecap="butt" opacity=".9"/>
      <path d="M${pt(ft[0] - 3.4, ft[1] - 1.6)} q2.4,-3 6.6,-1.2 l3.8,2.8 l-10.4,0 z" fill="${C.shoe}"/>
      <path d="M${pt(ft[0] - 2.6, ft[1] - 2.4)} q2,-1.6 4.4,-.8" stroke="#6a5f54" stroke-width=".8" fill="none"/>`;
  };
  if (d.sit) {
    back += `<ellipse cx="${f(hip[0])}" cy="${f(hip[1] + 9)}" rx="18" ry="5.4" fill="${d.robe2}"/>
      <ellipse cx="${f(hip[0] - 4)}" cy="${f(hip[1] + 7.6)}" rx="12" ry="3" fill="${d.robe}" opacity=".7"/>`;
  } else {
    back += leg(legPts[1], true);
    front += leg(legPts[0], false);
  }
  // 袍：肩寬 ±9.5，腰身往前圓出（round 越大越圓），下擺 ±15
  const hemY = hip[1] + (d.sit ? 9 : 15.5);
  const belly = 12 + 6 * R, rear = 11.5 + 2.4 * R, hemF = 14 + 2.6 * R, hemB = 12.5 + 1.6 * R;
  const robe = `<path d="M${pt(...P(sh, -9.5))} L${pt(...P(sh, 9))}
      C${pt(...P(along(hip, 24), belly - 2))} ${pt(...P(along(hip, 7), belly + 2))} ${pt(hip[0] + hemF, hemY)}
      L${pt(hip[0] - hemB, hemY + 1)} C${pt(...P(along(hip, 8), -rear - 1.5))} ${pt(...P(along(hip, 22), -rear))} ${pt(...P(sh, -9.5))} Z"
      fill="${d.robe}" stroke="${d.robe2}" stroke-width="1.1"/>
    <path d="M${pt(...P(sh, -7.4))} C${pt(...P(along(hip, 22), -rear + 2.2))} ${pt(...P(along(hip, 8), -rear + .8))} ${pt(hip[0] - hemB + 2.2, hemY - .4)}"
      fill="none" stroke="${d.robe2}" stroke-width="4.4" stroke-linecap="round" opacity=".42"/>
    <path d="M${pt(...P(sh, 7.6))} C${pt(...P(along(hip, 23), belly - 3.4))} ${pt(...P(along(hip, 8), belly))} ${pt(hip[0] + hemF - 1.8, hemY - 1.5)}" fill="none" stroke="${d.robeLit}" stroke-width="2" opacity=".7"/>
    <path d="M${pt(hip[0] - hemB + .5, hemY + 1)} L${pt(hip[0] + hemF - .3, hemY)}" stroke="${d.robe2}" stroke-width="2.2"/>
    ${d.back ? '' : `<path d="M${pt(...P(sh, -2))} L${pt(...P(along(hip, 13), 7))} L${pt(...P(sh, 6.5))}" fill="${d.inner}" stroke="${d.robe2}" stroke-width=".8"/>
      <path d="M${pt(...P(sh, 4))} L${pt(...P(along(hip, 13), 7.5))}" stroke="${d.robe2}" stroke-width="1" opacity=".7"/>`}
    <path d="M${pt(...P(along(hip, 4.5), -rear + .5))} L${pt(...P(along(hip, 4.5), belly + .2))}" stroke="${d.sash}" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M${pt(...P(along(hip, 6), -rear + 1))} L${pt(...P(along(hip, 6), belly - .8))}" stroke="#fff6dc" stroke-width="1" opacity=".55"/>
    ${d.back
      ? `<path d="M${pt(...P(along(hip, 4.5), -rear + 1))} l-6,8 m6,-8 l-1.5,9.5" stroke="${d.sash}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="${f(P(along(hip, 4.5), -rear + 1)[0])}" cy="${f(P(along(hip, 4.5), -rear + 1)[1])}" r="2.2" fill="${d.sash}"/>`
      : `<circle cx="${f(P(along(hip, 4.5), belly - 3)[0])}" cy="${f(P(along(hip, 4.5), belly - 3)[1])}" r="2.1" fill="${d.sash}" stroke="#c9b27a" stroke-width=".6"/>`}`;
  // 頭：半徑 10.6，圓臉、雙頰、眉、亮點眼、髮髻＋髮帶
  const hx = head[0], hy = head[1], HR = 10.6;
  const bun = [hx - 2.5, hy - HR - 3.2];
  const ribbonTail = `<path d="M${pt(bun[0] - 3, bun[1] + 2)} q-6,3 -9,9 M${pt(bun[0] - 2.6, bun[1] + 2.4)} q-3,5 -3,11" stroke="${d.ribbon}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const hairTop = `<circle cx="${f(bun[0])}" cy="${f(bun[1])}" r="4.6" fill="${C.hair}"/><path d="M${pt(bun[0] - 2.6, bun[1] - 2.4)} q2,-1.6 4,-.6" stroke="${C.hairLit}" stroke-width="1.2" fill="none"/>
     <path d="M${pt(bun[0] - 4.4, bun[1] + 2.2)} L${pt(bun[0] + 4.4, bun[1] + 2.2)}" stroke="${d.ribbon}" stroke-width="2.2" stroke-linecap="round"/>`;
  let face;
  if (d.back) {
    face = `${ribbonTail}<circle cx="${f(hx)}" cy="${f(hy)}" r="${HR}" fill="${C.hair}"/>
      <path d="M${pt(hx - 6, hy - 6)} q4,-4 9,-3" stroke="${C.hairLit}" stroke-width="1.6" fill="none"/>
      <ellipse cx="${f(hx + 7.4)}" cy="${f(hy + 2.4)}" rx="2.2" ry="3.2" fill="${C.skin2}"/>${hairTop}`;
  } else {
    face = `${ribbonTail}<circle cx="${f(hx)}" cy="${f(hy)}" r="${HR}" fill="${C.skin}"/>
      <path d="M${pt(hx - 7, hy + 7)} Q${pt(hx, hy + 11.6)} ${pt(hx + 8, hy + 6)}" stroke="${C.skin2}" stroke-width="1.6" fill="none" opacity=".6"/>
      <path d="M${pt(hx - 10.8, hy + 2.4)} Q${pt(hx - 11.4, hy - 11)} ${pt(hx + 1, hy - 11.2)} Q${pt(hx + 10, hy - 10)} ${pt(hx + 10.6, hy - 3.6)}
        Q${pt(hx + 6, hy - 7.2)} ${pt(hx + 1.4, hy - 6.4)} Q${pt(hx - 2, hy - 4.4)} ${pt(hx - 4.4, hy - 6.2)} L${pt(hx - 5.2, hy + 4.4)} Z" fill="${C.hair}"/>
      <path d="M${pt(hx - 7.4, hy - 8.4)} q4,-2.6 8,-2.2" stroke="${C.hairLit}" stroke-width="1.4" fill="none"/>
      <path d="M${pt(hx + 2.6, hy - 3.2)} q2,-1.2 4,-.2" stroke="${C.hair}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <ellipse cx="${f(hx + 4.6)}" cy="${f(hy + .4)}" rx="1.3" ry="1.65" fill="${C.ink}"/><circle cx="${f(hx + 5)}" cy="${f(hy - .2)}" r=".45" fill="#fff"/>
      <ellipse cx="${f(hx + 3.2)}" cy="${f(hy + 4.6)}" rx="2.6" ry="1.7" fill="${C.blush}" opacity=".5"/>
      <path d="M${pt(hx + 6.2, hy + 5.2)} q1.4,1.2 3,-.2" stroke="#a5654a" stroke-width=".95" fill="none" stroke-linecap="round"/>
      ${d.beard ? `<path d="M${pt(hx + 3, hy + 7)} q1,8 -3,12 q4,-1 6,-6 q1,-4 -1,-6 Z" fill="#e8e2d6" stroke="#bdb5a6" stroke-width=".6"/>` : ''}
      <ellipse cx="${f(hx - 6.6)}" cy="${f(hy + 1.6)}" rx="2" ry="2.8" fill="${C.skin2}"/>${hairTop}`;
  }
  const neckSvg = `<path d="M${pt(...sh)} L${pt(...neck)}" stroke="${C.skin2}" stroke-width="5.4"/>`;
  // 手臂：袖子較寬、袖口淺色
  const arm = (el, hand, color) => {
    const cuff = lerp(el, hand, .78);
    return `<path d="M${pt(...sh)} L${pt(...el)} L${pt(...cuff)}" fill="none" stroke="${color}" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M${pt(...lerp(el, hand, .7))} L${pt(...cuff)}" stroke="${d.inner}" stroke-width="7" stroke-linecap="butt" opacity=".85"/>
      <circle cx="${f(hand[0])}" cy="${f(hand[1])}" r="2.9" fill="${C.skin}" stroke="${C.skin2}" stroke-width=".5"/>`;
  };
  let loadBack = '', loadFront = '';
  if (d.load === 'pole') {
    const c = add(sh, [0, -3.4]);
    const pa = d.poleTilt;
    const e1 = add(c, rot([40, 0], pa)), e2 = add(c, rot([-40, 0], pa));
    const sag = 1.5 + d.fill * 3.5 + d.sag;
    const pole = `<path d="M${pt(e2[0], e2[1] + sag)} Q${pt(c[0], c[1] - 1.5)} ${pt(e1[0], e1[1] + sag)}" fill="none" stroke="${C.wood}" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M${pt(e2[0] + 4, e2[1] + sag - 1)} Q${pt(c[0], c[1] - 2.6)} ${pt(e1[0] - 4, e1[1] + sag - 1)}" fill="none" stroke="${C.woodLit}" stroke-width="1" opacity=".7"/>`;
    const hang = (e, sw) => {
      const top = [e[0], e[1] + sag];
      const end = add(top, rot([0, 24], sw));
      return `<path d="M${pt(...top)} L${pt(...end)}" stroke="#7b6a52" stroke-width="1.1"/>` + bucket(end[0], end[1], sw, d.fill);
    };
    loadBack += hang(e2, d.swing * 0.8);
    loadFront += pole + hang(e1, d.swing);
    const pf = add(c, rot([15, 0], pa)), pb = add(c, rot([-13, 0], pa));
    back += arm(add(sh, [-6, 9]), d.freeArm ? add(sh, [-10, 22]) : [pb[0], pb[1] + 1], d.robe2);
    loadFront += arm(add(sh, [9, 9]), [pf[0], pf[1] + 1], d.robe);
  } else if (d.load === 'dip') {
    const b = d.bucketAt || [30, -14];
    loadFront += bucket(b[0], b[1], d.bucketRot || 18, d.fill);
    back += arm(add(sh, [6, 12]), [b[0] - 1, b[1] + 1], d.robe2);
    loadFront += arm(add(sh, [12, 10]), [b[0] + 2, b[1] + 2], d.robe);
    if (d.poleDown) back = `<path d="M-46,-2 L22,-3" stroke="${C.wood}" stroke-width="3.2" stroke-linecap="round"/>` + bucket(-40, -27, 0, 1, 1) + back;
  } else if (d.load === 'pour') {
    const b = d.bucketAt || [24, -66];
    loadFront += bucket(b[0], b[1], d.bucketRot || 78, 1);
    back += arm(add(sh, [6, 10]), [b[0] - 4, b[1] + 3], d.robe2);
    loadFront += arm(add(sh, [13, 2]), [b[0] + 4, b[1] - 3], d.robe);
    if (d.stream) loadFront += `<path d="M${pt(b[0] + 23, b[1] + 6)} q12,4 10,${d.stream}" stroke="${C.water}" stroke-width="4.8" fill="none" stroke-linecap="round" opacity=".9"/>
      <path d="M${pt(b[0] + 23, b[1] + 6)} q11,4 9,${d.stream}" stroke="${C.waterLight}" stroke-width="1.5" fill="none" opacity=".9"/>`;
  } else if (d.broom) {
    const h1 = add(sh, [14, 16]), h2 = add(sh, [6, 22]);
    loadFront += `<path d="M${pt(h1[0] - 4, h1[1] - 10)} L${pt(h1[0] + 18, h1[1] + 40)}" stroke="${C.wood}" stroke-width="2.4"/>
      <path d="M${pt(h1[0] + 14, h1[1] + 36)} l14,10 l-12,4 z" fill="#c7a86a"/><path d="M${pt(h1[0] + 16, h1[1] + 40)} l9,6" stroke="#a88a50" stroke-width=".8"/>`;
    back += arm(add(sh, [5, 12]), h2, d.robe2);
    loadFront += arm(add(sh, [10, 10]), h1, d.robe);
  } else if (d.sit) {
    loadFront += arm(add(sh, [9, 12]), add(hip, [6, -4]), d.robe);
  } else {
    back += arm(add(sh, [-3, 13]), add(sh, [-2, 25]), d.robe2);
    loadFront += arm(add(sh, [4, 13]), add(sh, [5, 25]), d.robe);
  }
  return `<g transform="translate(${f(d.x)},${f(d.y)}) scale(${f(d.s * d.dir)},${f(d.s)})" opacity="${d.opacity}">${loadBack}${back}${front}${robe}${neckSvg}${face}${loadFront}</g>`;
}
const MASTER = { robe: C.master, robe2: C.master2, robeLit: C.masterLit, sash: '#eadfc4', inner: '#f2ecdf', ribbon: '#8a7a5a', round: .7, beard: true };
const SENIOR = { robe: C.senior, robe2: C.senior2, robeLit: C.seniorLit, sash: '#f0e2c2', inner: '#f5eedd', ribbon: '#5a4a3a', round: .55 };

/* ---------- 姿勢：與 V1 相同的參數 ---------- */
const POSE = {
  idle:   { lean: 0, legs: [{ t: 4, k: 2 }, { t: -4, k: 2 }], load: 'pole', fill: 0 },
  emptyA: { lean: 6, legs: [{ t: 24, k: 6 }, { t: -20, k: 22 }], bob: 0, swing: 10, fill: 0 },
  loadA:  { lean: 15, legs: [{ t: 18, k: 16 }, { t: -14, k: 12 }], bob: 3, swing: 3, fill: .9, poleTilt: -3 },
  grownA: { lean: 8, legs: [{ t: 30, k: 10 }, { t: -26, k: 28 }], bob: -1, swing: 6, fill: .9, freeArm: true },
  dip:    { lean: 32, legs: [{ t: 80, k: 80 }, { t: -6, k: 96 }], load: 'dip', fill: .5, bucketAt: [32, -12], bucketRot: 24, poleDown: true },
  pour:   { lean: 10, legs: [{ t: 10, k: 4 }, { t: -10, k: 4 }], load: 'pour', bucketAt: [20, -70], bucketRot: 80, stream: 26 },

const PATH = [[962, 512], [872, 540], [918, 592], [790, 636], [662, 612], [556, 656], [440, 694], [376, 702]];
function pathAt(t) {
  const segs = []; let total = 0;
  for (let i = 1; i < PATH.length; i++) { const l = Math.hypot(PATH[i][0] - PATH[i - 1][0], PATH[i][1] - PATH[i - 1][1]); segs.push(l); total += l; }
  let r = t * total;
  for (let i = 0; i < segs.length; i++) {
    if (r <= segs[i] || i === segs.length - 1) { const k = Math.min(1, r / segs[i]); const p = lerp(PATH[i], PATH[i + 1], k); return { x: p[0], y: p[1] }; }
    r -= segs[i];
  }
}
// 轉角圓滑：每個轉角前後各留 r 的直線，中間用二次曲線
function smoothD(points, r = 26) {
  let d = `M${pt(...points[0])}`;
  for (let i = 1; i < points.length - 1; i++) {
    const a = points[i - 1], b = points[i], c = points[i + 1];
    const la = Math.hypot(b[0] - a[0], b[1] - a[1]), lc = Math.hypot(c[0] - b[0], c[1] - b[1]);
    const ra = Math.min(r, la / 2), rc = Math.min(r, lc / 2);
    const p1 = lerp(b, a, ra / la), p2 = lerp(b, c, rc / lc);
    d += ` L${pt(...p1)} Q${pt(...b)} ${pt(...p2)}`;
  }
  return d + ` L${pt(...points[points.length - 1])}`;
}

function stoneSteps() {

    const u = [dir[0] / len, dir[1] / len], n = [-u[1], u[0]];
    const depth = 0.8 + (a.y - 500) / 260 * 0.35;
    const w = 14.5 * depth, h = 5.6 * depth;
    const j = (r() - .5) * 2.4;
    const c = [a.x + n[0] * j, a.y + n[1] * j * .6];
    const q = (sx, sy) => pt(c[0] + n[0] * sx * w + u[0] * sy * h, c[1] + (n[1] * sx * w) * .62 + u[1] * sy * h);

    s += `<path d="M${q(-1.02, 1.05)} L${q(1.02, 1.05)}" stroke="${C.slabDark}" stroke-width="1.3" opacity=".8"/>`;

// 遠山三層＋雲帶＋左上暖光；草坡有前中後明暗
function terrain() {

  for (let i = 0; i < 46; i++) { const x = r() * 1600, y = 600 + r() * 280; dots += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(1.4 + r() * 1.2)}" fill="${['#f5ecc2', '#f2cbd6', '#e9f0d6'][i % 3]}" opacity=".9"/>`; }
  return `
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9dcde"/><stop offset=".45" stop-color="#e9ecdf"/><stop offset=".7" stop-color="#f6ecd6"/></linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6c7c8"/><stop offset="1" stop-color="#d9e1dc"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93ab9f"/><stop offset="1" stop-color="#bccbbd"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9a7c"/><stop offset="1" stop-color="#a8b98f"/></linearGradient>
    <linearGradient id="slope" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#bccb88"/><stop offset=".6" stop-color="#a3b56f"/><stop offset="1" stop-color="#86a05c"/></linearGradient>
    <linearGradient id="plateau" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8d297"/><stop offset="1" stop-color="#aebe7c"/></linearGradient>
    <radialGradient id="sun" cx=".12" cy=".02" r=".85"><stop offset="0" stop-color="#fff3d2" stop-opacity=".7"/><stop offset=".5" stop-color="#fff3d2" stop-opacity=".18"/><stop offset="1" stop-color="#fff3d2" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".75"><stop offset=".65" stop-color="#2d3826" stop-opacity="0"/><stop offset="1" stop-color="#2d3826" stop-opacity=".28"/></radialGradient>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <circle cx="230" cy="120" r="46" fill="#fff8e2" opacity=".75"/>
  <path d="M0,236 L90,196 L170,214 L260,150 Q300,128 340,156 L430,204 L540,162 L640,214 L760,170 L880,218 L1010,150 Q1050,130 1090,152 L1220,206 L1350,154 L1480,196 L1600,170 L1600,420 L0,420 Z" fill="url(#far)"/>
  <g filter="url(#soft)" fill="#fff"><ellipse cx="390" cy="258" rx="320" ry="12" opacity=".75"/><ellipse cx="1160" cy="236" rx="290" ry="10" opacity=".65"/></g>
  <path d="M0,316 L120,268 Q160,252 200,276 L300,300 L420,240 Q460,226 500,250 L620,296 L740,262 L860,306 L980,264 L1100,296 L1230,250 Q1270,236 1310,258 L1440,296 L1600,256 L1600,460 L0,460 Z" fill="url(#mid)"/>
  <path d="M420,240 L436,262 L452,246 L470,268 M1230,250 L1246,270 L1262,256" stroke="#7e978a" stroke-width="2" fill="none" opacity=".6"/>

  <path d="M0,382 Q160,352 320,372 Q480,394 640,366 Q760,346 900,362 Q1000,372 1100,356 L1100,470 L0,470 Z" fill="url(#near)" opacity=".85"/>
  <path d="M0,420 Q300,380 620,430 Q760,452 860,420 L960,360 Q1200,300 1600,280 L1600,900 L0,900 Z" fill="url(#slope)"/>

}
function foreground() {
  // 前景：左下松枝與右下竹葉框住畫面，深一點，帶出遠近
  return `<g opacity=".95">
    <path d="M-20,900 Q40,820 140,800 Q220,790 260,820" stroke="#4a3626" stroke-width="10" fill="none" stroke-linecap="round"/>

    <path d="M1640,640 Q1560,740 1530,900" stroke="#4f6a35" stroke-width="7" fill="none"/><path d="M1636,644 Q1558,742 1527,900" stroke="#7f9a55" stroke-width="2" fill="none"/>
    ${[[1592, 700, 20], [1566, 742, -10], [1552, 786, 14], [1540, 830, -18], [1534, 872, 8]].map(([x, y, a], i) => [-1, 1].map(s => `<path d="M${x},${y} q${s * -26},${-12 + a * .3} ${s * -64},${a * .4} q${s * 30},${10 + a * .2} ${s * 64},${-a * .4} Z" fill="${(i + (s > 0 ? 1 : 0)) % 2 ? '#3f5b2c' : '#567a3c'}"/>`).join('')).join('')}

/* ---------- 完整場景（觀察狀態，與 V1 observe 同站位） ---------- */
function sceneAfter() {
  const p = pathAt(0.55);

  const objs = [

    { y: 528, s: shadow(1120, 528) + pose('sweep', { x: 1120, y: 528, s: .78, dir: -1 }) },
    { y: 520, s: vat(1000, 520, .55) },

    { y: 640, s: bush(706, 662, 1, true) }, { y: 610, s: rock(520, 610, 1.1, C.stone, true) }, { y: 590, s: bush(1030, 596, .9) },

    { y: 760, s: rock(760, 742, 1, C.stone) }
  ].sort((a, b) => a.y - b.y).map(o => o.s).join('');
  return `<svg class="scene" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">

// 地點與主角的名牌：兩張都套同一組，用來確認改後仍看得出人、泉水、水缸、道館
function labels(p) {
  return `<div class="tag place" style="left:1246px;top:168px">道館</div><div class="tag place" style="left:312px;top:620px">泉水</div>
    <div class="tag place" style="left:1000px;top:422px">水缸</div><div class="tag hero" style="left:${f(p.x)}px;top:${f(p.y + 6)}px">主角</div>`;
}

/* ---------- 板 ---------- */
function boardAfter() { return `<div class="board" id="after">${sceneAfter()}${labels(pathAt(.55))}</div>`; }
function boardCompare() {
  const B = window.BEFORE || {};
  // 改前與改後各自有 sky、slope 等同名 id，放進同一張 SVG 前加前綴，免得互相蓋掉漸層
  const scope = (svg, pre) => (svg || '').replace(/id="([^"]+)"/g, `id="${pre}$1"`).replace(/url\(#([^)]+)\)/g, `url(#${pre}$1)`);
  B.scene = scope(B.scene, 'b-');
  const half = (svg, x, y) => `<g transform="translate(${x},${y}) scale(.5)">${(svg || '').replace(/<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '')}</g>`;
  const crop = (svg, x, y, cx, cy, s, id) => `<clipPath id="${id}"><rect x="${x}" y="${y}" width="380" height="250" rx="8"/></clipPath>
    <g clip-path="url(#${id})"><g transform="translate(${x + 190 - cx * s},${y + 125 - cy * s}) scale(${s})">${(svg || '').replace(/<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '')}</g></g>
    <rect x="${x}" y="${y}" width="380" height="250" rx="8" fill="none" stroke="${C.line}"/>`;
  const p = pathAt(.55);
  const after = scope(sceneAfter(), 'a-');
  return `<div class="board tall" id="compare"><svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="var(--font)">
    <rect width="1600" height="1000" fill="#f6efe0"/>
    <text x="30" y="40" font-size="24" font-weight="700" fill="${C.ink}" font-family="var(--serif)">挑水山路：改前／改後</text>
    <text x="30" y="62" font-size="13" fill="#6b6254">同一鏡頭、同一站位（主角上山負重 55%），路徑點、水缸、泉水、道館位置都沒動，只換畫法。下排是 2× 局部。</text>
    <text x="30" y="92" font-size="15" font-weight="700" fill="${C.ink}">改前（V1／V3 現況）</text><text x="815" y="92" font-size="15" font-weight="700" fill="${C.ink}">改後（BL-V03 方向）</text>
    <clipPath id="ha"><rect x="20" y="102" width="780" height="439"/></clipPath><clipPath id="hb"><rect x="805" y="102" width="780" height="439"/></clipPath>
    <g clip-path="url(#ha)">${half(B.scene, 20, 102)}</g><g clip-path="url(#hb)">${half(after, 805, 102)}</g>
    <rect x="20" y="102" width="780" height="439" fill="none" stroke="${C.line}"/><rect x="805" y="102" width="780" height="439" fill="none" stroke="${C.line}"/>
    <text x="30" y="576" font-size="15" font-weight="700" fill="${C.ink}">局部 2×：泉水與溪</text>
    <text x="830" y="576" font-size="15" font-weight="700" fill="${C.ink}">局部 2×：主角與石階</text>
    ${crop(B.scene, 20, 590, 300, 712, 2, 'c1')}${crop(after, 410, 590, 300, 712, 2, 'c2')}
    ${crop(B.scene, 805, 590, p.x, p.y - 40, 2, 'c3')}${crop(after, 1195, 590, p.x, p.y - 40, 2, 'c4')}
    <text x="210" y="862" text-anchor="middle" font-size="12" fill="#6b6254">改前</text><text x="600" y="862" text-anchor="middle" font-size="12" fill="#6b6254">改後</text>
    <text x="995" y="862" text-anchor="middle" font-size="12" fill="#6b6254">改前</text><text x="1385" y="862" text-anchor="middle" font-size="12" fill="#6b6254">改後</text>
    ${['山路：土路改成沿彎道鋪的石階，遠窄近寬；轉角圓滑，路邊有草、小石與野花，眼睛會順著路從泉水走到道館。',
       '層次：遠山三層＋兩道雲帶；左上暖光、右下冷影；前景左下松枝、右下竹葉與四角微暗，主角所在的中景最亮。',
       '水：竹管水柱有高光、落點三圈漣漪，石池加石緣，溢出的小溪往左下流，池邊蘆葦與苔石。',
       '點景：路中段兩棵楓樹與道館前梅樹給暖色節奏，石燈籠標出水缸位置；全部不擋路面與主角（依腳底 y 排序）。']
      .map((t, i) => `<text x="30" y="${894 + i * 22}" font-size="13" fill="#3d362d">· ${t}</text>`).join('')}
  </svg></div>`;
}
function boardHero() {
  const B = window.BEFORE || {};

  const row = (y, title, getter, scale) => `<text x="40" y="${y - 120 * scale / 3}" font-size="15" font-weight="700" fill="${C.ink}">${title}</text>` +
    poses.map(([k], i) => { const x = 240 + i * 150; return shadow(x, y, 20 * scale / 1.6, .2) + getter(k, x, y, scale); }).join('');
  const oldFig = (k, x, y, s) => `<g transform="translate(${x},${y}) scale(${s})">${(B.poses || {})[k] || ''}</g>`;
  const newFig = (k, x, y, s) => pose(k, { x, y, s, dir: 1 });
  return `<div class="board tall" id="hero"><svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="var(--font)">

    ${poses.map(([, l], i) => cell(240 + i * 150, 488, l)).join('')}
    <rect x="1060" y="80" width="520" height="420" rx="12" fill="#fffaf0" stroke="${C.line}"/>
    <text x="1080" y="110" font-size="15" font-weight="700" fill="${C.ink}">實際遊玩大小（1×，約 60px 高）</text>
    <rect x="1080" y="124" width="480" height="200" rx="8" fill="#b8c681"/>
    <path d="M1080,270 Q1300,240 1560,262" stroke="${C.earth}" stroke-width="30" fill="none"/>
    ${shadow(1200, 262, 17)}<g transform="translate(1200,262) scale(.78)">${(B.poses || {}).loadA || ''}</g>
    ${shadow(1420, 258, 17)}${pose('loadA', { x: 1420, y: 258, s: .78 })}
    <text x="1200" y="300" text-anchor="middle" font-size="12" fill="#3d362d">改前</text><text x="1420" y="300" text-anchor="middle" font-size="12" fill="#3d362d">改後</text>
    <text x="1080" y="352" font-size="13" fill="#3d362d">· 小尺寸先看輪廓：圓臉、髮髻紅髮帶、淺色交領</text>
    <text x="1080" y="372" font-size="13" fill="#3d362d">  和腰結，在 45～60px 時仍分得出正背面。</text>
    <text x="1080" y="398" font-size="13" fill="#3d362d">· 主角仍是藍袍，和名冊、名牌、選取色一致；</text>
    <text x="1080" y="418" font-size="13" fill="#3d362d">  師父紫、師兄褐也沿用，只是改成同一套畫法。</text>
    <text x="1080" y="444" font-size="13" fill="#3d362d">· 師父加白鬚、身形較瘦；師兄最瘦，</text>
    <text x="1080" y="464" font-size="13" fill="#3d362d">  三人輪廓先靠體型和顏色就分得開。</text>
    <rect x="20" y="520" width="1560" height="460" rx="12" fill="#fffaf0" stroke="${C.line}"/>
    <text x="40" y="552" font-size="15" font-weight="700" fill="${C.ink}">改後細節（放大 3.2×）</text>
    ${pose('idle', { x: 200, y: 900, s: 3.2 })}${pose('emptyA', { x: 470, y: 900, s: 3.2, back: true })}
    ${pose('meditate', { x: 760, y: 900, s: 2.2 })}${pose('sweep', { x: 960, y: 900, s: 2.2, dir: -1 })}
    ${cell(200, 950, '正面 3/4：交領、腰結、袖口、綁腿')}${cell(470, 950, '背面 3/4：髮髻、髮帶尾、背後腰結')}
    ${cell(760, 950, '師父（2.2×）')}${cell(960, 950, '師兄（2.2×）')}
    ${['頭略大（半徑 9.6→10.6）、臉圓、雙頰微紅，眉眼加一點神情；', '身形圓潤：袍子在腰腹往前圓出，背側收得較少（#170 的胖胖初學者方向）；', '　這只是造型，不代表較弱，也不改任何速度或數值；', '交領內衫、寬腰帶打結、袖口與綁腿用淺色，讓小尺寸也看得出衣服結構；', '光從左上：袍子前緣一道亮邊、背側一層暗面；木桶、扁擔也有亮邊；', '髮帶用朱紅，是場景裡少數的暖色點，遠看也找得到主角。']
      .map((t, i) => `<text x="1100" y="${590 + i * 26}" font-size="13" fill="#3d362d">· ${t}</text>`).join('')}
  </svg></div>`;
}

if (want) document.body.classList.add('single');
