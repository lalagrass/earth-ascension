<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>回院預演 · 10 秒剪輯 · 未連遊戲</title>
<style>
  body { margin: 0; background: #1c1a17; color: #f6e7c4; font: 18px/1.45 "PingFang TC", "Noto Sans TC", sans-serif; }
  main { width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  video { width: 100%; background: #111; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
  button { font: inherit; padding: 6px 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  figure { margin: 0; background: #efe6d4; color: #2c2824; }
  img { width: 100%; display: block; }
  figcaption { padding: 8px 10px; }
  .readout { min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>設計預演 · 同路同負重 · 未連遊戲</h1>
  <p>四格是泉眼、石階、溪橋、回院。影片把回程壓成 10 秒。初學負重回程的 1× 紙上估量是 42.73 遊戲秒，所以這段大約是 4 倍剪輯，不是模型計時。</p>
  <video id="clip" src="return-load.mp4" muted playsinline></video>
  <div class="row">
    <button id="play" type="button">播放</button>
    <button id="pause" type="button">暫停</button>
    <button id="replay" type="button">重播</button>
  </div>
  <p class="readout" id="readout">未播放</p>
  <div class="grid">
    <figure><img src="../paint/spring.jpg" alt=""><figcaption>1 泉眼出發。兩人剛挑起滿桶。</figcaption></figure>
    <figure><img src="../paint/steps.jpg" alt=""><figcaption>2 石階。熟手在前，初學還在下階。</figcaption></figure>
    <figure><img src="../paint/bridge.jpg" alt=""><figcaption>3 溪橋。同高、同是滿桶。</figcaption></figure>
    <figure><img src="../paint/yard.jpg" alt=""><figcaption>4 回院。熟手更靠近水缸。</figcaption></figure>
  </div>
</main>
<script>
const clip = document.getElementById('clip');
const readout = document.getElementById('readout');
clip.loop = false;
function text() {
  if (clip.ended) return '10 秒剪輯結束。設計預演，不是腳力驗收。';
  if (clip.paused) return '暫停 ' + clip.currentTime.toFixed(2) + ' 秒';
  return '播放 ' + clip.currentTime.toFixed(2) + ' 秒';
}
function paint() { readout.textContent = text(); }
clip.addEventListener('timeupdate', paint);
clip.addEventListener('ended', () => { clip.pause(); paint(); });
document.getElementById('play').addEventListener('click', () => {
  if (clip.ended) clip.currentTime = 0;
  clip.play();
});
document.getElementById('pause').addEventListener('click', () => { clip.pause(); paint(); });
document.getElementById('replay').addEventListener('click', () => {
  clip.pause();
  clip.currentTime = 0;
  clip.play();
});
paint();
</script>
</body>
</html>
