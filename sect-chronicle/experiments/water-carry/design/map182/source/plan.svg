<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350">
  <title>青石生活盆地 · 設計板 · 未連遊戲</title>
  <desc>坐標見 layout.json。遠村、山門與巡山石堆不是可走工作區。</desc>
  <rect width="2400" height="1350" fill="#f4ecdc"/>
  <path d="M0 220 C400 80 700 260 1100 160 C1500 60 1900 200 2400 80 L2400 0 L0 0 Z" fill="#d7e3c8"/>
  <path d="M0 420 C500 300 900 480 1400 360 C1800 280 2100 420 2400 340 L2400 1350 L0 1350 Z" fill="#e7f0d4"/>
  <ellipse cx="260" cy="190" rx="180" ry="70" fill="#d5d0c4" opacity=".85"/>
  <ellipse cx="520" cy="150" rx="70" ry="36" fill="#c4b49a"/>
  <path d="M1040 360 C900 300 700 250 500 210" fill="none" stroke="#8a4b3a" stroke-width="8" stroke-dasharray="14 10"/>
  <path d="M1760 560 L1580 500 L1380 450 L1180 400 L1040 360" fill="none" stroke="#8a7348" stroke-width="10"/>
  <path d="M300 1160 C420 1080 560 1000 700 920 C860 820 1100 860 1400 760 C1600 680 1760 560 1760 560" fill="none" stroke="#7ec8c8" stroke-width="28" opacity=".55"/>
  <polyline points="1760,560 1620,640 1480,720 1320,790 1160,850 1000,900 860,860 740,780 620,860 500,960 390,1060 300,1160" fill="none" stroke="#3d6b8a" stroke-width="14" stroke-linejoin="round"/>
  <polyline points="1760,560 1860,680 1960,820 2060,960 2160,1100 2240,1200" fill="none" stroke="#6a8a3d" stroke-width="12" stroke-linejoin="round"/>
  <rect x="1780" y="300" width="420" height="280" rx="8" fill="#f7f1e4" stroke="#c4b59a"/>
  <path d="M1780 360 H2200" stroke="#c4b59a"/>
  <polygon points="1860,250 2200,250 2260,330 1800,330" fill="#8d95a0"/>
  <rect x="1980" y="360" width="90" height="70" fill="#6b5344"/>
  <ellipse cx="1860" cy="500" rx="46" ry="28" fill="#6aa8a8"/>
  <rect x="1600" y="450" width="110" height="22" rx="6" fill="#b7a48a"/>
  <path d="M1460 430 L1540 430 L1560 520 L1440 520 Z" fill="#d8e2c4" stroke="#6a8a3d"/>
  <ellipse cx="300" cy="1160" rx="90" ry="48" fill="#7ec8c8"/>
  <rect x="680" y="750" width="140" height="18" fill="#c4a574"/>
  <path d="M2100 1080 L2320 1080 L2340 1280 L2080 1280 Z" fill="#c5d6a4"/>
  <rect x="2140" y="1120" width="70" height="8" fill="#a8844a"/>
  <rect x="2140" y="1140" width="70" height="8" fill="#a8844a"/>
  <circle cx="1040" cy="360" r="28" fill="#cfc6b6" stroke="#8a7348"/>
  <circle cx="500" cy="210" r="16" fill="#e7d7c4" stroke="#8a4b3a"/>
  <g font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="28" fill="#2c2824">
    <text x="1960" y="400">道館 · 現有</text>
    <text x="1810" y="470">水缸</text>
    <text x="1688" y="620">院中端點</text>
    <text x="1588" y="440">石凳</text>
    <text x="1460" y="400">護欄 · 現有</text>
    <text x="700" y="740">溪橋</text>
    <text x="240" y="1220">泉眼 · 現有</text>
    <text x="2140" y="1060">藥圃 · 現有</text>
    <text x="1888" y="700">藥架</text>
    <text x="980" y="330">觀景石</text>
    <text x="470" y="120">山門 · 景觀</text>
    <text x="180" y="170">遠村 · 景觀</text>
    <text x="430" y="250">巡山石堆 · 候選</text>
    <text x="2060" y="600">院邊空地</text>
  </g>
  <g font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="22">
    <rect x="1000" y="48" width="640" height="250" rx="12" fill="#fffaf1" stroke="#c4b59a"/>
    <text x="1024" y="88" font-size="30" fill="#2c2824">青石生活盆地 · 一個主案</text>
    <text x="1024" y="126" fill="#3d6b8a">挑水 1709.1 · 現有功能，拉長</text>
    <text x="1024" y="158" fill="#6a8a3d">採藥 800.4 · 現有功能，另一側</text>
    <text x="1024" y="190" fill="#8a7348">看山 747.6 · 現有休閒</text>
    <text x="1024" y="222" fill="#8a4b3a">巡山虛線 · 未來候選，不是路線</text>
    <text x="1024" y="262" fill="#5c564c">2400×1350 設計板 · 未連遊戲</text>
  </g>
  <g font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="20" fill="#5c564c">
    <rect x="1680" y="40" width="680" height="150" rx="12" fill="#fffaf1" stroke="#c4b59a"/>
    <rect x="1704" y="64" width="160" height="90" fill="none" stroke="#2c2824" stroke-dasharray="6 4"/>
    <text x="1880" y="100">虛線是現有 1600×900</text>
    <text x="1880" y="128">同比例外框，不是舊坐標套位</text>
    <text x="1704" y="168">人物透明幀框高 107（214÷2），非透明可見高 86.5（主角）／84.5（熟手）。</text>
  </g>
  <g transform="translate(680 1060)" font-family="PingFang TC, Noto Sans TC, sans-serif">
    <rect x="0" y="0" width="860" height="230" rx="12" fill="#fffaf1" stroke="#c4b59a"/>
    <text x="24" y="36" font-size="22" font-weight="bold" fill="#2c2824">人物與幀框尺度對照（非透明可見 vs 透明幀框 vs 腳底 anchor）</text>
    <!-- 地面接觸基準線 -->
    <line x1="40" y1="160" x2="820" y2="160" stroke="#8a7348" stroke-width="2"/>
    <text x="590" y="152" font-size="16" fill="#8a7348">地面基準線（腳底 anchor y=92）</text>

    <!-- 主角 -->
    <rect x="60" y="53" width="107" height="107" fill="none" stroke="#a09888" stroke-dasharray="4 3"/>
    <rect x="80" y="73.5" width="58" height="86.5" rx="6" fill="#4f78a8" opacity=".75"/>
    <circle cx="113.5" cy="160" r="4" fill="#c4452d"/>
    <text x="60" y="46" font-size="14" fill="#7a7060">透明幀框 107</text>
    <text x="76" y="122" font-size="17" fill="#fff">主角 86.5</text>

    <!-- 熟手 -->
    <rect x="230" y="53" width="107" height="107" fill="none" stroke="#a09888" stroke-dasharray="4 3"/>
    <rect x="250" y="75.5" width="60" height="84.5" rx="6" fill="#6c8a68" opacity=".75"/>
    <circle cx="283.5" cy="160" r="4" fill="#c4452d"/>
    <text x="230" y="46" font-size="14" fill="#7a7060">透明幀框 107</text>
    <text x="246" y="122" font-size="17" fill="#fff">熟手 84.5</text>

    <!-- 候選新角 -->
    <rect x="400" y="75" width="56" height="85" rx="6" fill="#c49a68" stroke="#8a6840" stroke-dasharray="3 3" opacity=".65"/>
    <circle cx="428" cy="160" r="4" fill="#c4452d"/>
    <text x="390" y="46" font-size="14" fill="#8a6840">候選尺度 ~85（未定）</text>
    <text x="402" y="122" font-size="15" fill="#2c2824">候選新角</text>

    <text x="24" y="196" font-size="16" fill="#5c564c">說明：幀框 107 為 atlas 214÷2 容器；實際可見身高為 alpha bbox（主角 86.5、熟手 84.5）；紅點為腳底 anchor(45, 92)。</text>
    <text x="24" y="218" font-size="15" fill="#8a6840">概念新人物僅示意候選尺度約 80–90 場景單位，尚未工程鎖定。</text>
  </g>
</svg>
