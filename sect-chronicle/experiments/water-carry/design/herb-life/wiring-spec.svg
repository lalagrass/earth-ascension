<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg { fill: #f5eedb; }
      .box { fill: #fffaf0; stroke: #8c7b64; stroke-width: 1.5; rx: 6px; }
      .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #2c251e; }
      .sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #6e5d4b; }
      .card-title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #3b5d85; }
      .lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #2c251e; }
      .muted { font-family: system-ui, sans-serif; font-size: 10px; fill: #6e5d4b; }
      .highlight { font-family: system-ui, sans-serif; font-size: 10px; font-weight: bold; fill: #8a4a1e; }
      .layer-bar { rx: 4px; stroke-width: 1; }
      .code { font-family: monospace; font-size: 10px; fill: #2b4667; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="500" class="bg"/>

  <!-- 抬頭與說明 -->
  <text x="25" y="32" class="title">LP-15 C 最小接線規格與圖層結構圖 (800×500)</text>
  <text x="25" y="48" class="sub">圖層遮擋 (zIndex) ｜ 掛點偏移量 (Attach Offsets) ｜ 最小接線檔案清單（接線階段實施）</text>

  <!-- 1. 左側：圖層堆疊與 zIndex 規範 -->
  <g transform="translate(25, 65)">
    <rect width="360" height="400" class="box"/>
    <text x="16" y="26" class="card-title">① 圖層順序與 zIndex 規範 (渲染管線)</text>

    <!-- herbOut 去程圖層 -->
    <text x="16" y="56" class="lbl"><b>A. 去程 (herbOut)</b>：空簍在身後</text>
    <rect x="20" y="66" width="320" height="20" fill="#e8dcc2" stroke="#b5a28a" class="layer-bar"/>
    <text x="30" y="80" class="code">z - 0.03: 空簍 (背部遮擋，只露出邊緣)</text>
    <rect x="20" y="90" width="320" height="20" fill="#d2e3f5" stroke="#7da6d8" class="layer-bar"/>
    <text x="30" y="104" class="code">z: 人物主體 Sprite (腳底錨點 anchorPx 24, 44)</text>

    <!-- herbGather 採摘圖層 -->
    <text x="16" y="132" class="lbl"><b>B. 採摘 (herbGather)</b>：簍放身前腳邊</text>
    <rect x="20" y="142" width="320" height="20" fill="#d8e8d0" stroke="#8cb880" class="layer-bar"/>
    <text x="30" y="156" class="code">z - 0.01: 藥圃泥土與植株</text>
    <rect x="20" y="166" width="320" height="20" fill="#d2e3f5" stroke="#7da6d8" class="layer-bar"/>
    <text x="30" y="180" class="code">z: 俯身蹲採人物主體 Sprite</text>
    <rect x="20" y="190" width="320" height="20" fill="#fcecd2" stroke="#dcb070" class="layer-bar"/>
    <text x="30" y="204" class="code">z + 0.02: 藥鋤工具 (手部掛點 +16, -8)</text>
    <rect x="20" y="214" width="320" height="20" fill="#f7e0cb" stroke="#cf956b" class="layer-bar"/>
    <text x="30" y="228" class="code">z + 0.03: 側邊藥簍 (逐漸填滿 load = k)</text>

    <!-- herbBack 負重回程圖層 -->
    <text x="16" y="256" class="lbl"><b>C. 回程 (herbBack)</b>：滿簍在背部可見</text>
    <rect x="20" y="266" width="320" height="20" fill="#d2e3f5" stroke="#7da6d8" class="layer-bar"/>
    <text x="30" y="280" class="code">z: 前傾負重人物 Sprite (旋轉 -8°)</text>
    <rect x="20" y="290" width="320" height="20" fill="#f7e0cb" stroke="#cf956b" class="layer-bar"/>
    <text x="30" y="304" class="code">z + 0.03: 滿載背簍 (身後上方清晰可見 load=1.0)</text>

    <!-- herbDeliver 交藥圖層 -->
    <text x="16" y="332" class="lbl"><b>D. 交藥 (herbDeliver)</b>：卸簍入架</text>
    <rect x="20" y="342" width="320" height="20" fill="#e8dfce" stroke="#b8ab94" class="layer-bar"/>
    <text x="30" y="356" class="code">z: 曬藥架本體 (兩層竹篩 + 立柱)</text>
    <rect x="20" y="366" width="320" height="20" fill="#d2e3f5" stroke="#7da6d8" class="layer-bar"/>
    <text x="30" y="380" class="code">z + 0.02: 雙手捧草入篩 (手部掛點 -22, -26)</text>
  </g>

  <!-- 2. 右側：掛點偏移量與最小接線檔案清單 -->
  <g transform="translate(410, 65)">
    <rect width="365" height="400" class="box"/>
    <text x="16" y="26" class="card-title">② 掛點偏移與最小接線差異清單</text>

    <!-- 掛點座標表格 -->
    <text x="16" y="56" class="lbl"><b>掛點偏移量規格 (相對人物原點 p.x, p.y)</b></text>
    <rect x="16" y="66" width="333" height="110" fill="#fffdfa" stroke="#dfd2be" rx="4"/>
    <text x="24" y="84" class="code">• 人物腳底錨點: (0, 0) · 對齊地表路線節點</text>
    <text x="24" y="104" class="code">• 去程身後背簍: (p.x - 8*face, p.y - 19)</text>
    <text x="24" y="124" class="code">• 採摘腳邊置簍: (p.x - 16, p.y) · load: 0 → 1</text>
    <text x="24" y="144" class="code">• 回程負重背簍: (p.x - 1.5*face, p.y - 17) · load: 1</text>
    <text x="24" y="164" class="code">• 交藥身前卸簍: (p.x - 16, p.y) · load: 1 → 0</text>

    <!-- 最低接線檔案清單 -->
    <text x="16" y="200" class="lbl"><b>後續接線階段最小修改檔案清單 (白名單預覽)</b></text>
    <rect x="16" y="210" width="333" height="120" fill="#fffdfa" stroke="#dfd2be" rx="4"/>
    <text x="24" y="228" class="highlight">1. demo/app.mjs (僅強化 drawBasket / drawRack / placeBasket)</text>
    <text x="24" y="246" class="muted">   - 無需重構 model.mjs 或 routes.mjs</text>
    <text x="24" y="264" class="highlight">2. demo/style.css (藥架與採藥浮字樣式微調)</text>
    <text x="24" y="282" class="muted">   - 無需新增外部依賴或新 CSS 類別</text>
    <text x="24" y="300" class="highlight">3. checks/water15.test.mjs (新增採藥動作輔助驗收)</text>
    <text x="24" y="318" class="muted">   - 驗證 herbOut/Gather/Back/Deliver 階段狀態與交付入帳</text>

    <text x="16" y="354" font-size="11" font-weight="bold" fill="#8a6416">★ 來源與授權聲明：</text>
    <text x="16" y="372" class="sub">• 所有向量設計圖稿與規格為專案原創，採 CC0 協議。</text>
    <text x="16" y="388" class="sub">• 不使用未授權之外部商業遊戲素材或閉源圖庫。</text>
  </g>
</svg>