<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <style>
      .bg { fill: #f5eedb; }
      .card-box { fill: #fffaf0; stroke: #8c7b64; stroke-width: 1.5; rx: 8px; }
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #2c251e; }
      .phase-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #3b5d85; }
      .sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #6e5d4b; }
      .body-txt { font-family: system-ui, sans-serif; font-size: 11px; fill: #2c251e; }
      .highlight { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #8a4a1e; }
      .meta-lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #8a6416; font-weight: bold; }
      .tag-pill { fill: rgba(47, 42, 36, 0.88); rx: 3px; }
      .tag-txt { font-family: system-ui, sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; }
      .anchor-dot { fill: #d9534f; }
      .attach-dot { fill: #2f6d3a; }
      .arr { stroke: #8c7b64; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .ground-line { stroke: #cbba9e; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8c7b64" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="560" class="bg"/>

  <!-- 抬頭與說明 -->
  <text x="30" y="36" class="title">LP-15 H2 採藥動作質感四段分鏡規範 (Storyboard)</text>
  <text x="30" y="54" class="sub">採摘 (herbGather) → 裝簍 (herbStow) → 背回 (herbBack) → 交藥 (herbDeliver) ｜ 標註腳底 Anchor、掛點與前後遮擋</text>

  <!-- ==================== 四個分鏡面板 ==================== -->

  <!-- 分鏡 1：採摘 (herbGather 前段 k=0.0~0.5) -->
  <g transform="translate(30, 75)">
    <rect width="220" height="450" class="card-box"/>
    <text x="14" y="28" class="phase-title">① 採摘 (Gather)</text>
    <text x="14" y="44" class="sub">模型階段：herbGather (前段)</text>
    <text x="14" y="58" class="highlight">動作：俯身微蹲 · 手持藥鋤細拔</text>

    <!-- 視覺繪圖區 (高 220px) -->
    <rect x="10" y="70" width="200" height="190" fill="#fdfbf7" stroke="#e8dfce" rx="4"/>
    <line x1="20" y1="210" x2="190" y2="210" class="ground-line"/>
    <!-- 藥圃土畦與植株 -->
    <rect x="40" y="200" width="120" height="10" fill="#8a6a4e" rx="2"/>
    <ellipse cx="60" cy="195" rx="4" ry="6" fill="#4f8a3e"/>
    <ellipse cx="100" cy="196" rx="4" ry="6" fill="#4f8a3e"/>
    <!-- 主角微蹲姿態 (中心前傾) -->
    <g transform="translate(100, 210)">
      <!-- 身體微蹲前傾 -->
      <rect x="-8" y="-36" width="18" height="26" rx="4" fill="#3b5d85" transform="rotate(15)"/>
      <circle cx="2" cy="-44" r="7" fill="#e8c89b"/>
      <!-- 手持木鋤向下拔草 -->
      <line x1="6" y1="-26" x2="16" y2="-8" stroke="#e8c89b" stroke-width="2"/>
      <line x1="16" y1="-14" x2="20" y2="-4" stroke="#6e5434" stroke-width="1.8"/>
      <!-- 藥簍置於腳邊 (原點 x - 16, zIndex = p.y + 0.03) -->
      <polygon points="-26,-18 -14,-18 -16,0 -24,0" fill="#b08a4e" stroke="#6e5434"/>
      <!-- Anchor 腳底點 -->
      <circle cx="0" cy="0" r="3.5" class="anchor-dot"/>
      <!-- 手部掛點 (Hand Attach) -->
      <circle cx="16" cy="-8" r="3" class="attach-dot"/>
      <!-- 簍具掛點 (Basket Attach) -->
      <circle cx="-20" cy="0" r="3" class="attach-dot"/>
      <!-- 頭頂標籤 -->
      <rect x="-40" y="-70" width="80" height="16" class="tag-pill"/>
      <text x="-34" y="-58" class="tag-txt">採藥中 25%</text>
    </g>

    <!-- 規格與掛點說明 -->
    <text x="14" y="280" class="meta-lbl">腳底 Anchor: (0, 0)</text>
    <text x="14" y="296" class="body-txt">手部掛點: (+16, -8) 撥土細拔</text>
    <text x="14" y="312" class="body-txt">簍具位置: (-20, 0) 腳邊前方</text>
    <text x="14" y="328" class="body-txt">遮擋層級: 簍具在身前 (z + 0.03)</text>
    <text x="14" y="344" class="body-txt">草藥裝載: load = k (0.0 → 0.5)</text>
    <line x1="14" y1="356" x2="206" y2="356" stroke="#e8dfce"/>
    <text x="14" y="374" class="sub">細節：手腕有微幅撥泥動作，</text>
    <text x="14" y="388" class="sub">避免單純靜止下蹲；草藥自畦面</text>
    <text x="14" y="402" class="sub">拔起時有 2px 微晃彈起反饋。</text>
    <text x="14" y="424" class="highlight">時長：約 2.5 秒 (自然節奏)</text>
  </g>

  <!-- 分鏡 2：裝簍 (herbGather 後段 k=0.5~1.0) -->
  <g transform="translate(270, 75)">
    <rect width="220" height="450" class="card-box"/>
    <text x="14" y="28" class="phase-title">② 裝簍 (Stow)</text>
    <text x="14" y="44" class="sub">模型階段：herbGather (後段)</text>
    <text x="14" y="58" class="highlight">動作：直身收鋤 · 束草入簍</text>

    <!-- 視覺繪圖區 -->
    <rect x="10" y="70" width="200" height="190" fill="#fdfbf7" stroke="#e8dfce" rx="4"/>
    <line x1="20" y1="210" x2="190" y2="210" class="ground-line"/>
    <g transform="translate(100, 210)">
      <!-- 身體微轉向側邊 -->
      <rect x="-8" y="-40" width="18" height="28" rx="4" fill="#3b5d85"/>
      <circle cx="0" cy="-48" r="7" fill="#e8c89b"/>
      <!-- 雙手將草藥束放進簍中 -->
      <line x1="-2" y1="-30" x2="-14" y2="-20" stroke="#e8c89b" stroke-width="2"/>
      <ellipse cx="-15" cy="-20" rx="4" ry="2" fill="#5f9a4a"/>
      <!-- 藥簍已放入滿滿草藥 -->
      <polygon points="-24,-20 -10,-20 -12,0 -22,0" fill="#b08a4e" stroke="#6e5434"/>
      <ellipse cx="-17" cy="-20" rx="5" ry="3" fill="#4f8a3e"/>
      <!-- Anchor 點 -->
      <circle cx="0" cy="0" r="3.5" class="anchor-dot"/>
      <circle cx="-15" cy="-20" r="3" class="attach-dot"/>
      <!-- 頭頂標籤 -->
      <rect x="-40" y="-74" width="80" height="16" class="tag-pill"/>
      <text x="-34" y="-62" class="tag-txt">裝簍中 85%</text>
    </g>

    <!-- 規格與說明 -->
    <text x="14" y="280" class="meta-lbl">腳底 Anchor: (0, 0)</text>
    <text x="14" y="296" class="body-txt">手部掛點: (-15, -20) 雙手置藥入簍</text>
    <text x="14" y="312" class="body-txt">簍具位置: (-17, 0) 腳邊側向</text>
    <text x="14" y="328" class="body-txt">遮擋層級: 簍具在手部前下方</text>
    <text x="14" y="344" class="body-txt">草藥裝載: load = 1.0 (裝滿)</text>
    <line x1="14" y1="356" x2="206" y2="356" stroke="#e8dfce"/>
    <text x="14" y="374" class="sub">細節：藥草進簍後簍口冒出</text>
    <text x="14" y="388" class="sub">深淺兩色綠葉尖；手部收回腰側，</text>
    <text x="14" y="402" class="sub">準備起步背簍返院。</text>
    <text x="14" y="424" class="highlight">時長：約 2.5 秒 (採摘共 5 秒)</text>
  </g>

  <!-- 分鏡 3：背回 (herbBack 負重返程) -->
  <g transform="translate(510, 75)">
    <rect width="220" height="450" class="card-box"/>
    <text x="14" y="28" class="phase-title">③ 背回 (Carry Back)</text>
    <text x="14" y="44" class="sub">模型階段：herbBack (整段)</text>
    <text x="14" y="58" class="highlight">動作：負重背簍 · 沉穩步態返院</text>

    <!-- 視覺繪圖區 -->
    <rect x="10" y="70" width="200" height="190" fill="#fdfbf7" stroke="#e8dfce" rx="4"/>
    <line x1="20" y1="210" x2="190" y2="210" class="ground-line"/>
    <g transform="translate(100, 210)">
      <!-- 身體前傾負重步伐 -->
      <rect x="-8" y="-42" width="18" height="30" rx="4" fill="#3b5d85" transform="rotate(-8)"/>
      <circle cx="-4" cy="-50" r="7" fill="#e8c89b"/>
      <!-- 背帶跨肩 -->
      <line x1="-4" y1="-38" x2="4" y2="-28" stroke="#8a6416" stroke-width="1.8"/>
      <!-- 背簍在身後 (可見，zIndex = p.y + 0.03) -->
      <polygon points="4,-36 18,-36 15,-16 2,-16" fill="#b08a4e" stroke="#6e5434"/>
      <ellipse cx="11" cy="-36" rx="6" ry="3" fill="#4f8a3e"/>
      <!-- Anchor 點 -->
      <circle cx="0" cy="0" r="3.5" class="anchor-dot"/>
      <circle cx="10" cy="-26" r="3" class="attach-dot"/>
      <!-- 頭頂標籤 -->
      <rect x="-42" y="-76" width="84" height="16" class="tag-pill"/>
      <text x="-36" y="-64" class="tag-txt">採藥·回程 60%</text>
    </g>

    <!-- 規格與說明 -->
    <text x="14" y="280" class="meta-lbl">腳底 Anchor: (0, 0)</text>
    <text x="14" y="296" class="body-txt">背簍掛點: (+10, -26) 背部中心</text>
    <text x="14" y="312" class="body-txt">負重重心: 軀幹前傾 8 度</text>
    <text x="14" y="328" class="body-txt">遮擋層級: 背簍在軀幹後上方可見</text>
    <text x="14" y="344" class="body-txt">速度對比: 負重 4.2 vs 空身 7.5</text>
    <line x1="14" y1="356" x2="206" y2="356" stroke="#e8dfce"/>
    <text x="14" y="374" class="sub">對照：去程空身步頻輕盈快速，</text>
    <text x="14" y="388" class="sub">背簍背在身後大部分被軀幹遮擋；</text>
    <text x="14" y="402" class="sub">回程滿載綠草冒出，步伐節奏沉著。</text>
    <text x="14" y="424" class="highlight">時長：依真實腳力 (Lv 1 / Lv 3)</text>
  </g>

  <!-- 分鏡 4：交藥 (herbDeliver 交付與收益入帳) -->
  <g transform="translate(750, 75)">
    <rect width="220" height="450" class="card-box"/>
    <text x="14" y="28" class="phase-title">④ 交藥 (Deliver)</text>
    <text x="14" y="44" class="sub">模型階段：herbDeliver (交付)</text>
    <text x="14" y="58" class="highlight">動作：卸簍入篩 · 藥架逐份顯示</text>

    <!-- 視覺繪圖區 -->
    <rect x="10" y="70" width="200" height="190" fill="#fdfbf7" stroke="#e8dfce" rx="4"/>
    <line x1="20" y1="210" x2="190" y2="210" class="ground-line"/>
    <!-- 藥架竹篩本體 -->
    <line x1="40" y1="170" x2="40" y2="210" stroke="#8a6a3e" stroke-width="2.5"/>
    <ellipse cx="56" cy="184" rx="18" ry="4" fill="#d8bf86" stroke="#9a7a44"/>
    <ellipse cx="56" cy="198" rx="18" ry="4" fill="#d8bf86" stroke="#9a7a44"/>
    <!-- 新增藥草束 -->
    <circle cx="50" cy="183" r="2.5" fill="#4f8a3e"/>
    <g transform="translate(130, 210)">
      <!-- 身體面向藥架 (左傾) -->
      <rect x="-8" y="-40" width="18" height="28" rx="4" fill="#3b5d85" transform="rotate(-6)"/>
      <circle cx="-3" cy="-48" r="7" fill="#e8c89b"/>
      <!-- 雙手捧藥草放入架中竹篩 -->
      <line x1="-2" y1="-28" x2="-22" y2="-26" stroke="#e8c89b" stroke-width="2"/>
      <ellipse cx="-24" cy="-26" rx="4" ry="2" fill="#5f9a4a"/>
      <!-- 卸下的藥簍置於身後腳邊 -->
      <polygon points="12,-18 24,-18 22,0 14,0" fill="#b08a4e" stroke="#6e5434"/>
      <!-- 浮字入帳反饋 -->
      <text x="-48" y="-62" font-size="13" font-weight="bold" fill="#2f6d3a">+1 份藥</text>
      <!-- Anchor 點 -->
      <circle cx="0" cy="0" r="3.5" class="anchor-dot"/>
      <circle cx="-22" cy="-26" r="3" class="attach-dot"/>
      <!-- 頭頂標籤 -->
      <rect x="-36" y="-86" width="72" height="16" class="tag-pill"/>
      <text x="-30" y="-74" class="tag-txt">交付靈草</text>
    </g>

    <!-- 規格與說明 -->
    <text x="14" y="280" class="meta-lbl">腳底 Anchor: (0, 0)</text>
    <text x="14" y="296" class="body-txt">交付掛點: (-22, -26) 雙手捧草置篩</text>
    <text x="14" y="312" class="body-txt">簍具位置: (+18, 0) 卸於身後</text>
    <text x="14" y="328" class="body-txt">收益入帳: 藥架 herbs +1 (至 8 份)</text>
    <text x="14" y="344" class="body-txt">浮字時長: 1600ms 淡出</text>
    <line x1="14" y1="356" x2="206" y2="356" stroke="#e8dfce"/>
    <text x="14" y="374" class="sub">結算：交付結算那一 tick 藥架</text>
    <text x="14" y="388" class="sub">竹篩立即多一束草藥，人物 trips+1</text>
    <text x="14" y="402" class="sub">並推進腳力升級 XP；零數值溢出。</text>
    <text x="14" y="424" class="highlight">時長：約 1.8 秒 (交付動作完成)</text>
  </g>
</svg>