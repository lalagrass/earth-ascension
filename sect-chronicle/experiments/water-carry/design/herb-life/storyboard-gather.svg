<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <style>
      .bg { fill: #f5eedb; }
      .card-box { fill: #fffaf0; stroke: #8c7b64; stroke-width: 1.5; rx: 8px; }
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #2c251e; }
      .phase-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #3b5d85; }
      .sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #6e5d4b; }
      .body-txt { font-family: system-ui, sans-serif; font-size: 11px; fill: #2c251e; }
      .highlight { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #8a4a1e; }
      .meta-lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #8a6416; font-weight: bold; }
      .tag-pill { fill: rgba(47, 42, 36, 0.88); rx: 3px; }
      .tag-txt { font-family: system-ui, sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; }
      .anchor-dot { fill: #d9534f; }
      .attach-dot { fill: #2f6d3a; }
      .ground-line { stroke: #cbba9e; stroke-width: 2; }
      .badge-m { fill: #e6f4ea; stroke: #137333; stroke-width: 1; rx: 3px; }
      .badge-txt-m { font-family: system-ui, sans-serif; font-size: 9px; font-weight: bold; fill: #137333; }
      .badge-v { fill: #fef7e0; stroke: #b06000; stroke-width: 1; rx: 3px; }
      .badge-txt-v { font-family: system-ui, sans-serif; font-size: 9px; font-weight: bold; fill: #b06000; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="560" class="bg"/>

  <!-- 抬頭與說明 -->
  <text x="30" y="34" class="title">LP-15 H2 採藥動作質感四段分鏡規範 (Storyboard)</text>
  <text x="30" y="52" class="sub">模型階段：herbGather (4s, k 前後段切換姿態) → herbBack (負重返院) → herbDeliver (4s 交付入帳) ｜ 標註腳底 Anchor 與掛點</text>

  <!-- ==================== 四個分鏡面板 ==================== -->

  <!-- 分鏡 1：採摘 (herbGather 前段 k=0.0~0.5) -->
  <g transform="translate(30, 70)">
    <rect width="220" height="465" class="card-box"/>
    <text x="14" y="26" class="phase-title">① 採摘 (Gather)</text>
    <rect x="14" y="34" width="60" height="15" class="badge-m"/>
    <text x="18" y="45" class="badge-txt-m">herbGather</text>
    <text x="80" y="46" class="sub">k: 0.0 ~ 0.5 (前 2.0s)</text>
    <text x="14" y="62" class="highlight">動作：俯身微蹲 · 撥土探尋草藥</text>

    <!-- 視覺繪圖區 -->
    <rect x="10" y="72" width="200" height="185" fill="#fdfbf7" stroke="#e8dfce" rx="4"/>
    <line x1="20" y1="210" x2="190" y2="210" class="ground-line"/>
    <!-- 藥圃土畦與植株 -->
    <rect x="40" y="200" width="120" height="10" fill="#8a6a4e" rx="2"/>
    <ellipse cx="60" cy="195" rx="4" ry="6" fill="#4f8a3e"/>
    <ellipse cx="100" cy="196" rx="4" ry="6" fill="#4f8a3e"/>
    <!-- 主角微蹲姿態 (中心前傾) -->
    <g transform="translate(100, 210)">
      <!-- 身體微蹲前傾 -->
      <rect x="-8" y="-36" width="18" height="26" rx="4" fill="#3b5d85" transform="rotate(15)"/>
      <circle cx="2" cy="-44" r="7" fill="#e8c89b"/>
      <!-- 手持木鋤向下拔草 -->
      <line x1="6" y1="-26" x2="14" y2="-8" stroke="#e8c89b" stroke-width="2"/>
      <line x1="14" y1="-14" x2="18" y2="-4" stroke="#6e5434" stroke-width="1.8"/>
      <!-- 藥簍置於腳邊 (原點 x - 18, zIndex = p.y + 0.03) -->
      <polygon points="-26,-18 -14,-18 -16,0 -24,0" fill="#b08a4e" stroke="#6e5434"/>
      <!-- Anchor 腳底點 -->
      <circle cx="0" cy="0" r="3.5" class="anchor-dot"/>
      <!-- 手部掛點 (Hand Attach) -->
      <circle cx="14" cy="-8" r="3" class="attach-dot"/>
      <!-- 簍具掛點 (Basket Attach) -->
      <circle cx="-18" cy="0" r="3" class="attach-dot"/>
      <!-- 頭頂標籤 -->
      <rect x="-40" y="-70" width="80" height="16" class="tag-pill"/>
      <text x="-34" y="-58" class="tag-txt">採藥中 25%</text>
    </g>

    <!-- 規格與掛點說明 -->
    <text x="14" y="274" class="meta-lbl">腳底 Anchor: (0, 0)</text>
    <text x="14" y="290" class="body-txt">手部提案: (+14, -8) 撥土細拔 [提案]</text>
    <text x="14" y="306" class="body-txt">簍具位置: (-18, 0) 腳邊身前</text>
    <text x="14" y="322" class="body-txt">遮擋層級: 簍具在身前 (z + 0.03)</text>
    <text x="14" y="338" class="body-txt">草藥裝載: load = k (0.0 → 0.5)</text>
    <line x1="14" y1="350" x2="206" y2="350" stroke="#e8dfce"/>
    <text x="14" y="368" class="sub">細節：手腕有微幅撥泥動作，</text>
    <text x="14" y="382" class="sub">避免單純下蹲靜止；草藥自畦面</text>
    <text x="14" y="396" class="sub">拔起時有微幅起伏反饋。</text>
    <text x="14" y="416" class="meta-lbl">模型階段：herbGather</text>
    <text x="14" y="432" class="highlight">時長：2.0 秒 (k: 0.0 ~ 0.5)</text>
  </g>

  <!-- 分鏡 2：裝簍 (herbGather 後段 k=0.5~1.0) -->
  <g transform="translate(270, 70)">
    <rect width="220" height="465" class="card-box"/>
    <text x="14" y="26" class="phase-title">② 裝簍 (Stow)</text>
    <rect x="14" y="34" width="60" height="15" class="badge-m"/>
    <text x="18" y="45" class="badge-txt-m">herbGather</text>
    <text x="80" y="46" class="sub">k: 0.5 ~ 1.0 (後 2.0s)</text>
    <text x="14" y="62" class="highlight">動作：抖泥理草 · 收整放入身前簍</text>

    <!-- 視覺繪圖區 -->
    <rect x="10" y="72" width="200" height="185" fill="#fdfbf7" stroke="#e8dfce" rx="4"/>
    <line x1="20" y1="210" x2="190" y2="210" class="ground-line"/>
    <g transform="translate(100, 210)">
      <!-- 身體前傾較大，雙手將草藥放進簍子 -->
      <rect x="-10" y="-38" width="18" height="28" rx="4" fill="#3b5d85" transform="rotate(22)"/>
      <circle cx="5" cy="-45" r="7" fill="#e8c89b"/>
      <!-- 雙手捧草向簍子放 -->
      <line x1="2" y1="-26" x2="-8" y2="-12" stroke="#e8c89b" stroke-width="2"/>
      <ellipse cx="-12" cy="-12" rx="4" ry="2" fill="#4f8a3e"/>
      <!-- 身前簍子已半滿到全滿 -->
      <polygon points="-26,-18 -14,-18 -16,0 -24,0" fill="#b08a4e" stroke="#6e5434"/>
      <ellipse cx="-20" cy="-18" rx="5" ry="2.5" fill="#4f8a3e"/>
      <!-- Anchor 點 -->
      <circle cx="0" cy="0" r="3.5" class="anchor-dot"/>
      <circle cx="-12" cy="-12" r="3" class="attach-dot"/>
      <!-- 頭頂標籤 -->
      <rect x="-40" y="-70" width="80" height="16" class="tag-pill"/>
      <text x="-34" y="-58" class="tag-txt">採藥中 75%</text>
    </g>

    <!-- 規格與說明 -->
    <text x="14" y="274" class="meta-lbl">腳底 Anchor: (0, 0)</text>
    <text x="14" y="290" class="body-txt">手部提案: (+6, -12) 收整入簍 [提案]</text>
    <text x="14" y="306" class="body-txt">簍具位置: (-18, 0) 腳邊身前</text>
    <text x="14" y="322" class="body-txt">遮擋層級: 身前可見 (z + 0.03)</text>
    <text x="14" y="338" class="body-txt">草藥裝載: load = k (0.5 → 1.0 滿)</text>
    <line x1="14" y1="350" x2="206" y2="350" stroke="#e8dfce"/>
    <text x="14" y="368" class="sub">原模型無獨立 herbStow phase，</text>
    <text x="14" y="382" class="sub">在 herbGather 4.0s 常數內以 k 切換；</text>
    <text x="14" y="396" class="sub">k 達 1.0 時草藥綠芽自簍頂冒出。</text>
    <text x="14" y="416" class="meta-lbl">模型階段：herbGather</text>
    <text x="14" y="432" class="highlight">時長：2.0 秒 (與採摘合計整整 4.0s)</text>
  </g>

  <!-- 分鏡 3：背回 (herbBack 負重回程) -->
  <g transform="translate(510, 70)">
    <rect width="220" height="465" class="card-box"/>
    <text x="14" y="26" class="phase-title">③ 背回 (Carry Back)</text>
    <rect x="14" y="34" width="60" height="15" class="badge-m"/>
    <text x="18" y="45" class="badge-txt-m">herbBack</text>
    <text x="80" y="46" class="sub">路長 515.2 · 負重步態</text>
    <text x="14" y="62" class="highlight">動作：負重背簍 · 沉穩步態返院</text>

    <!-- 視覺繪圖區 -->
    <rect x="10" y="72" width="200" height="185" fill="#fdfbf7" stroke="#e8dfce" rx="4"/>
    <line x1="20" y1="210" x2="190" y2="210" class="ground-line"/>
    <g transform="translate(100, 210)">
      <!-- 身體前傾負重步伐 -->
      <rect x="-8" y="-42" width="18" height="30" rx="4" fill="#3b5d85" transform="rotate(-8)"/>
      <circle cx="-4" cy="-50" r="7" fill="#e8c89b"/>
      <!-- 背帶跨肩 -->
      <line x1="-4" y1="-38" x2="4" y2="-28" stroke="#8a6416" stroke-width="1.8"/>
      <!-- 背簍在身後 (可見，zIndex = p.y + 0.03) -->
      <polygon points="4,-36 18,-36 15,-16 2,-16" fill="#b08a4e" stroke="#6e5434"/>
      <ellipse cx="11" cy="-36" rx="6" ry="3" fill="#4f8a3e"/>
      <!-- Anchor 點 -->
      <circle cx="0" cy="0" r="3.5" class="anchor-dot"/>
      <circle cx="10" cy="-26" r="3" class="attach-dot"/>
      <!-- 頭頂標籤 -->
      <rect x="-42" y="-76" width="84" height="16" class="tag-pill"/>
      <text x="-36" y="-64" class="tag-txt">採藥·回程 60%</text>
    </g>

    <!-- 規格與說明 -->
    <text x="14" y="274" class="meta-lbl">腳底 Anchor: (0, 0)</text>
    <text x="14" y="290" class="body-txt">背簍掛點: (-2*face, -20) 背部上方</text>
    <text x="14" y="306" class="body-txt">負重重心: 前傾 8° (Lv1) / 5° (Lv3) [提案]</text>
    <text x="14" y="322" class="body-txt">遮擋層級: 背簍在背上可見 (z + 0.03)</text>
    <text x="14" y="338" class="body-txt">速度真值: 負重 40.0 (Lv1) / 52.0 (Lv3)</text>
    <line x1="14" y1="350" x2="206" y2="350" stroke="#e8dfce"/>
    <text x="14" y="368" class="sub">去程空身 60.0 (Lv1) / 74.4 (Lv3)，</text>
    <text x="14" y="382" class="sub">回程負重綠草冒出，步頻穩定沉著；</text>
    <text x="14" y="396" class="sub">依路長 515.2 自然換算，不人為加速。</text>
    <text x="14" y="416" class="meta-lbl">模型階段：herbBack</text>
    <text x="14" y="432" class="highlight">耗時：Lv1 12.88s ／ Lv3 9.91s</text>
  </g>

  <!-- 分鏡 4：交藥 (herbDeliver 交付與收益入帳) -->
  <g transform="translate(750, 70)">
    <rect width="220" height="465" class="card-box"/>
    <text x="14" y="26" class="phase-title">④ 交藥 (Deliver)</text>
    <rect x="14" y="34" width="60" height="15" class="badge-m"/>
    <text x="18" y="45" class="badge-txt-m">herbDeliver</text>
    <text x="80" y="46" class="sub">整整 4.0s · 收益入帳</text>
    <text x="14" y="62" class="highlight">動作：卸簍入架 · 藥架竹篩顯示</text>

    <!-- 視覺繪圖區 -->
    <rect x="10" y="72" width="200" height="185" fill="#fdfbf7" stroke="#e8dfce" rx="4"/>
    <line x1="20" y1="210" x2="190" y2="210" class="ground-line"/>
    <!-- 藥架竹篩本體 -->
    <line x1="40" y1="170" x2="40" y2="210" stroke="#8a6a3e" stroke-width="2.5"/>
    <ellipse cx="56" cy="184" rx="18" ry="4" fill="#d8bf86" stroke="#9a7a44"/>
    <ellipse cx="56" cy="198" rx="18" ry="4" fill="#d8bf86" stroke="#9a7a44"/>
    <!-- 新增藥草束 -->
    <circle cx="50" cy="183" r="2.5" fill="#4f8a3e"/>
    <g transform="translate(130, 210)">
      <!-- 身體面向藥架 (左傾) -->
      <rect x="-8" y="-40" width="18" height="28" rx="4" fill="#3b5d85" transform="rotate(-6)"/>
      <circle cx="-3" cy="-48" r="7" fill="#e8c89b"/>
      <!-- 雙手捧藥草放入架中竹篩 -->
      <line x1="-2" y1="-28" x2="-22" y2="-26" stroke="#e8c89b" stroke-width="2"/>
      <ellipse cx="-24" cy="-26" rx="4" ry="2" fill="#5f9a4a"/>
      <!-- 卸下的藥簍置於身後腳邊 -->
      <polygon points="12,-18 24,-18 22,0 14,0" fill="#b08a4e" stroke="#6e5434"/>
      <!-- 浮字入帳反饋 -->
      <text x="-48" y="-62" font-size="13" font-weight="bold" fill="#2f6d3a">+1 份藥</text>
      <!-- Anchor 點 -->
      <circle cx="0" cy="0" r="3.5" class="anchor-dot"/>
      <circle cx="-22" cy="-26" r="3" class="attach-dot"/>
      <!-- 頭頂標籤 -->
      <rect x="-36" y="-86" width="72" height="16" class="tag-pill"/>
      <text x="-30" y="-74" class="tag-txt">交付靈草</text>
    </g>

    <!-- 規格與說明 -->
    <text x="14" y="274" class="meta-lbl">腳底 Anchor: (0, 0)</text>
    <text x="14" y="290" class="body-txt">交付提案: (-22*face, -26) 捧草入篩 [提案]</text>
    <text x="14" y="306" class="body-txt">簍具位置: (+16*face, 0) 卸於身後</text>
    <text x="14" y="322" class="body-txt">收益入帳: 藥架 herbs +1 (上限 8 份)</text>
    <text x="14" y="338" class="body-txt">升級判定: 主角 1 趟升 Lv 2 (tripsToNext[0]=1)</text>
    <line x1="14" y1="350" x2="206" y2="350" stroke="#e8dfce"/>
    <text x="14" y="368" class="sub">交付那一 tick 藥架竹篩即時</text>
    <text x="14" y="382" class="sub">多一束草藥，人物 trips + 1，</text>
    <text x="14" y="396" class="sub">依 RULES.pourMs 耗時整整 4.0 秒。</text>
    <text x="14" y="416" class="meta-lbl">模型階段：herbDeliver</text>
    <text x="14" y="432" class="highlight">時長：整整 4.0 秒 (完全符合原模型)</text>
  </g>
</svg>