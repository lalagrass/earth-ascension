<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .bg { fill: #f5eedb; }
      .box { fill: #fffaf0; stroke: #8c7b64; stroke-width: 1.5; rx: 6px; }
      .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #2c251e; }
      .sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #6e5d4b; }
      .col-title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #3b5d85; }
      .row-lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #5a4a3a; font-weight: 500; }
      .val-bold { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #2c251e; }
      .val-adv { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #2f6d3a; }
      .bar-bg { fill: #e8dcc2; rx: 3px; }
      .bar-hero { fill: #3b5d85; rx: 3px; }
      .bar-cousin { fill: #6a5280; rx: 3px; }
      .badge { fill: #efe4cb; stroke: #cbba9e; stroke-width: 1; rx: 4px; }
      .badge-txt { font-family: system-ui, sans-serif; font-size: 10px; font-weight: bold; fill: #5a4a3a; }
      .note-txt { font-family: system-ui, sans-serif; font-size: 10px; fill: #8a6416; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" class="bg"/>

  <!-- 抬頭與說明 -->
  <text x="25" y="32" class="title">LP-15 H3 初學 vs 熟手同路徑動作與成長對照 (800×450)</text>
  <text x="25" y="48" class="sub">同一採藥路徑 (長度 520) ｜ 同一 1× 基準倍率 ｜ 依據 model.mjs 真實物理速度與真實重心姿態</text>

  <!-- 主對照卡片 (初學者 vs 熟練者) -->
  <g transform="translate(25, 65)">
    <!-- 卡片本體 -->
    <rect width="750" height="260" class="box"/>

    <!-- 表頭欄位 -->
    <rect x="15" y="15" width="230" height="28" fill="#eee4cb" rx="4"/>
    <text x="25" y="34" class="col-title">比較維度</text>

    <rect x="260" y="15" width="230" height="28" fill="#e2ebf5" rx="4"/>
    <text x="270" y="34" class="col-title">初學者：主角 (Lv 1)</text>

    <rect x="505" y="15" width="230" height="28" fill="#ebe2f5" rx="4"/>
    <text x="515" y="34" font-family="system-ui, sans-serif" font-size="13px" font-weight="bold" fill="#6a5280">熟練者：堂哥 (Lv 3)</text>

    <!-- 項目 1：空手去程速度 -->
    <text x="25" y="72" class="row-lbl">① 去程速度 (空手／空簍)</text>
    <text x="270" y="72" class="val-bold">7.5 單位／秒 <tspan font-weight="normal" fill="#6e5d4b">(耗時 69.3 秒)</tspan></text>
    <rect x="270" y="78" width="160" height="6" class="bar-bg"/>
    <rect x="270" y="78" width="120" height="6" class="bar-hero"/>

    <text x="515" y="72" class="val-adv">8.5 單位／秒 <tspan font-weight="normal" fill="#6e5d4b">(耗時 61.2 秒 · 快 13%)</tspan></text>
    <rect x="515" y="78" width="160" height="6" class="bar-bg"/>
    <rect x="515" y="78" width="136" height="6" class="bar-cousin"/>

    <!-- 項目 2：負重回程速度 -->
    <text x="25" y="112" class="row-lbl">② 回程速度 (滿簍負重)</text>
    <text x="270" y="112" class="val-bold">4.2 單位／秒 <tspan font-weight="normal" fill="#6e5d4b">(耗時 123.8 秒)</tspan></text>
    <rect x="270" y="118" width="160" height="6" class="bar-bg"/>
    <rect x="270" y="118" width="80" height="6" class="bar-hero"/>

    <text x="515" y="112" class="val-adv">5.1 單位／秒 <tspan font-weight="normal" fill="#6e5d4b">(耗時 102.0 秒 · 快 21%)</tspan></text>
    <rect x="515" y="118" width="160" height="6" class="bar-bg"/>
    <rect x="515" y="118" width="97" height="6" class="bar-cousin"/>

    <!-- 項目 3：動作重心與步頻 -->
    <text x="25" y="152" class="row-lbl">③ 身體姿態與步頻質感</text>
    <text x="270" y="152" class="val-bold">前傾 8° · 步伐沉重 · 步頻 1.8 步/秒</text>
    <text x="270" y="168" class="sub">負重時肩背微沉，簍中草藥隨步態微晃</text>

    <text x="515" y="152" class="val-adv">前傾 5° · 步伐穩健 · 步頻 2.2 步/秒</text>
    <text x="515" y="168" class="sub">重心平穩起伏小，步幅開展自然流暢</text>

    <!-- 項目 4：採摘作業耗時 -->
    <text x="25" y="202" class="row-lbl">④ 藥圃採摘時長 (herbGather)</text>
    <text x="270" y="202" class="val-bold">5.0 秒 <tspan font-weight="normal" fill="#6e5d4b">(細細拔土 · 熟稔度成長中)</tspan></text>
    <text x="515" y="202" class="val-adv">5.0 秒 <tspan font-weight="normal" fill="#6e5d4b">(動作乾脆俐落 · 手法精準)</tspan></text>

    <!-- 項目 5：單趟總耗時 -->
    <text x="25" y="238" class="row-lbl">⑤ 採藥完整單趟總耗時</text>
    <text x="270" y="238" font-size="12" font-weight="bold" fill="#3b5d85">約 198.1 秒 (交付 +1 份藥)</text>
    <text x="515" y="238" font-size="12" font-weight="bold" fill="#2f6d3a">約 168.2 秒 (快約 30 秒)</text>
  </g>

  <!-- 底部規格註記 -->
  <g transform="translate(25, 340)">
    <rect width="750" height="85" class="box" fill="#fffdfa"/>
    <text x="16" y="22" font-size="12" font-weight="bold" fill="#2c251e">★ 成長反饋保證 (嚴守 D29 邊界)</text>
    <text x="16" y="40" class="sub">1. 速度差異完全源自已有之腳力等級 (Lv 1 / Lv 3) 與負重係數，不以人為加速或剪輯偽造節奏。</text>
    <text x="16" y="56" class="sub">2. 採藥與挑水共享同一套腳力進度體系，每趟交付均推進 XP；主角完成 3 趟採藥即可升至 Lv 2。</text>
    <text x="16" y="72" class="note-txt">3. 嚴格不改動任何模型數值、不新增藥草品類、不變更產出計量 (每趟固定 +1 份藥至藥架)。</text>
  </g>
</svg>