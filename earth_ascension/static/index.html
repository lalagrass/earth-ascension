<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth Ascension · 靈氣紀元</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#e8e6dc;background:#0b1518}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:244px;background:#0f2024;border-right:1px solid #2c4346;padding:30px 18px;display:flex;flex-direction:column}main{margin-left:244px;padding:34px 4vw 70px;max-width:1550px}.brand{font-family:Georgia,serif;color:#e8cb8d;font-size:25px;line-height:1.25;letter-spacing:.03em}.brand small{display:block;font:11px ui-sans-serif,sans-serif;letter-spacing:.25em;color:#87a9a7;margin-top:8px}.nav{margin-top:38px;display:grid;gap:5px}.nav button{background:none;border:0;color:#a9bdba;text-align:left;padding:12px 15px;border-radius:9px}.nav button.active,.nav button:hover{background:#1d393b;color:#f1d69d}.sidefoot{margin-top:auto;font-size:12px;color:#718e8e;line-height:1.7}.eyebrow{font-size:11px;letter-spacing:.2em;color:#c5a76d;text-transform:uppercase}.top{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:30px}h1{font:40px Georgia,"Noto Serif TC",serif;margin:8px 0 5px;color:#f4ead6}h2{font:24px Georgia,serif;margin:0 0 16px;color:#f2dfb6}h3{margin:0 0 10px;font-size:16px;color:#f0e9d6}p{color:#a9bfbc;line-height:1.65}.muted{color:#819b9a}.button{border:1px solid #d6ae6a;background:#d2a96a;color:#142326;border-radius:9px;padding:12px 20px;font-weight:700;box-shadow:0 4px 20px #d7ac6430}.button:hover{background:#efc986}.button:disabled{opacity:.5;cursor:wait}.secondary{background:#1a3336;color:#ead9b4;box-shadow:none}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{border:1px solid #294246;background:#13272b;border-radius:13px;padding:22px;box-shadow:0 8px 35px #03101429}.stat .num{font:34px Georgia,serif;color:#f0d19a;margin:9px 0}.stat .label{color:#8ba9a5;font-size:13px}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#254242;color:#c4e1da;font-size:12px;margin:3px}.event{border-left:2px solid #bc9a64;padding:5px 0 5px 14px;margin:13px 0;color:#d3ded9}.event small{display:block;color:#7f9b99;margin-top:5px}.barrow{display:grid;grid-template-columns:75px 1fr 44px;align-items:center;gap:12px;margin:12px 0;color:#aac5bf}.bar{height:7px;background:#294244;border-radius:20px;overflow:hidden}.bar b{display:block;background:#d4af70;height:100%}input,select{background:#0c1c20;border:1px solid #3a595b;border-radius:7px;color:#f1eadb;padding:9px 10px;max-width:100%}input[type=number]{width:78px}.field{display:flex;flex-direction:column;gap:7px;color:#9cb6b1;font-size:13px}.formrow{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.questions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.q{background:#102328;border:1px solid #284043;border-radius:8px;padding:12px}.q label{display:block;color:#d5e0dc;font-size:13px;margin-bottom:7px}.q select{width:100%}.list{display:grid;gap:8px;max-height:590px;overflow:auto}.person{border:1px solid #2a4445;background:#102328;color:#dce5df;text-align:left;padding:10px;border-radius:8px}.person:hover,.person.active{border-color:#d2ae72}.person small{color:#8eaaa6;display:block;margin-top:4px}.badge{color:#d9bd83}.timeline{border-left:2px solid #3d5b5a;padding-left:18px}.timeline .event{margin-left:-20px}.notice{padding:15px;border-radius:8px;background:#203b3c;border:1px solid #6f876b;color:#e4e4c7;margin-bottom:18px}.error{border-color:#b16d67;background:#412627}.spark{width:100%;height:170px}.footnote{font-size:12px;color:#829b97;margin-top:20px}@media(max-width:900px){aside{position:static;width:auto;padding:18px}.nav{display:flex;overflow:auto;margin-top:16px}.nav button{white-space:nowrap}.sidefoot{display:none}main{margin:0;padding:25px 18px}.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:600px){.grid,.questions,.formrow{grid-template-columns:1fr}.top{display:block}.top .button{margin-top:15px}h1{font-size:31px}}
</style></head><body><aside><div class="brand">EARTH<br>ASCENSION<small>靈 氣 紀 元 · M2</small></div><div class="nav" id="nav"></div><div class="sidefoot">澄灣市 · 虛構現代城市<br>規則依存檔版本決定<br>資料只存於本機 SQLite</div></aside><main><div class="top"><div><div class="eyebrow" id="eyebrow">WORLD SIMULATION / 2026</div><h1 id="title">世界總覽</h1><div class="muted" id="subtitle">創造一個人，給他一個世界，看看他會成為誰。</div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button class="button" id="advance">推進一個月 →</button><select id="batchMonths" aria-label="連續推進月數"><option value="3">連續 3 月</option><option value="6">連續 6 月</option><option value="12">連續 12 月</option></select><button class="button secondary" id="batchAdvance" type="button">連續推進</button><button class="button secondary" id="stopAdvance" type="button" style="display:none">停止推進</button></div></div><div id="notice"></div><div id="content"></div></main>
<script src="/m2.js"></script>
<script>
const tabs=[['overview','世界總覽','World Overview'],['creator','創造人物','Character Genesis'],['observer','人物觀察','Character Observer'],['organizations','組織','Organizations'],['history','世界編年史','World History'],['chronicle','生命歷程','Life Chronicle']];
const traitNames=['根骨','悟性','意志','感知','社交'];const districts=['河港','學園','舊城','丘陵','工業灣'];
const questions=[
'遇到陌生現象，你會先嘗試理解原理嗎？','明知辛苦，仍會按計畫完成工作嗎？','新社區聚會中，你會主動與陌生人交談嗎？','同伴遇到困難，你會優先伸出援手嗎？','面對突發變化，你能保持冷靜嗎？','有新發現的可能，你願意投入時間探索嗎？','冒險可能傷害家人時，你會優先保護安全嗎？','資源有限時，你會分給更需要的人嗎？',
'既有說法無法解釋事情，你願意換個角度嗎？','長期目標進展很慢，你仍會持續嗎？','需要合作時，你會先建立連結嗎？','別人的立場不同，你會試著理解嗎？','研究失敗後，你能穩定地重新嘗試嗎？','未知事物值得你付出短期代價嗎？','做重大決定前，你會先評估風險嗎？','對社群有益但沒有回報，你仍會參與嗎？'];
let world=null,tab='overview',selected=101,viewMonth=null,flash='',personFilter='all',personDistrict='',personSearch='',advancing=false,stopRequested=false;
const answerPresets={neutral:[3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3],scholar:[5,4,3,3,4,5,2,3,5,4,3,3,4,5,3,3],builder:[3,5,3,3,5,2,5,3,3,5,3,3,5,2,5,3],community:[3,3,5,5,4,3,4,5,3,3,5,5,4,3,4,5]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=e=>`<div class="event" ${e.event_id?`id="event-${esc(e.event_id)}"`:''}>${esc(e.text)}<small>第 ${e.month} 月 · ${esc(e.kind)} · 原因：${esc((e.causes||[]).join('、'))}</small></div>`;
async function api(path,opt){let r=await fetch(path,opt);let v=await r.json();if(!r.ok)throw Error(v.error||'操作失敗');return v}
async function load(month=null){world=await api('/api/world'+(month===null?'':'?month='+month));viewMonth=month;flash='';document.getElementById('notice').innerHTML='';render()}
function notice(s,bad=false){flash=`<div class="notice ${bad?'error':''}">${esc(s)}</div>`;document.getElementById('notice').innerHTML=flash}
function syncControls(){let lock=viewMonth!==null||advancing;document.getElementById('advance').disabled=lock;document.getElementById('batchMonths').disabled=lock;document.getElementById('batchAdvance').disabled=lock;let sb=document.getElementById('stopAdvance');sb.style.display=advancing?'':'none';sb.disabled=!advancing||stopRequested;let cb=document.querySelector('#create button.button');if(cb)cb.disabled=advancing||Object.values(world?.people||{}).filter(p=>p.player).length>=3;let cg=document.getElementById('choose-goal');if(cg)cg.disabled=lock;let hm=document.getElementById('historyMonth');if(hm)hm.disabled=advancing;let lv=document.getElementById('live');if(lv)lv.disabled=advancing}
function render(){document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let item=tabs.find(x=>x[0]===tab);document.getElementById('title').textContent=item[1];document.getElementById('eyebrow').textContent=item[2]+' / '+(2026+Math.floor(world.month/12));document.getElementById('subtitle').textContent=`澄灣市 · 第 ${world.month} 月 · ${2026+Math.floor(world.month/12)} 年 ${world.month%12+1} 月`;
document.querySelector('.brand small').textContent=world.version==='0.1.0'?'靈 氣 紀 元 · M1':'靈 氣 紀 元 · M2';document.getElementById('content').innerHTML=tab==='observer'&&currentPerson().goals?m2Observer(currentPerson()):({overview,creator,observer,organizations,history,chronicle})[tab]();bind();syncControls()}
function stat(label,num,note){return `<div class="card stat"><div class="label">${label}</div><div class="num">${num}</div><div class="muted">${note}</div></div>`}
function chart(){let arr=world.trends;if(!arr.length)return '<p>推進月份後會顯示靈氣濃度趨勢。</p>';let points=arr.map((x,i)=>`${20+i*650/Math.max(1,arr.length-1)},${150-x.aura*130}`).join(' ');return `<svg class="spark" viewBox="0 0 700 170" preserveAspectRatio="none"><line x1="20" x2="680" y1="150" y2="150" stroke="#547070"/><polyline points="${points}" fill="none" stroke="#d5ae70" stroke-width="3"/></svg><div class="muted">平均靈氣濃度 · 逐月自然生成及波動</div>`}
let overviewPlayerFilter='all',pMajorRef=null,pMajorWorldRef=null,pMajorIds=new Set(),pMajorList=[];document.addEventListener('change',e=>{if(e.target?.id==='overviewPlayerFilter'){overviewPlayerFilter=e.target.value;render()}});
function getPlayerMajorEvents(){let evs=world?.events||[],people=world?.people||{};if(pMajorRef!==evs||pMajorWorldRef!==world){pMajorRef=evs;pMajorWorldRef=world;pMajorIds=new Set(evs.filter(x=>x&&x.event_id).map(x=>x.event_id));let players=Object.values(people).filter(p=>p&&p.player),seen=new Set(),collected=[],addEv=e=>{if(!e||!isPlayerImportant(e))return;let key=e.event_id||`${e.month}:${e.kind}:${e.actor??e.subject??''}:${e.target??''}:${e.text}`;if(seen.has(key))return;seen.add(key);collected.push(e)};players.forEach(p=>(p.chronicle||[]).forEach(addEv));for(let i=evs.length-1;i>=0&&evs[i]?.month===world.month;i--)addEv(evs[i]);if(!collected.length&&players.length){for(let i=evs.length-1;i>=0&&collected.length<21;i--)addEv(evs[i])}collected.sort((a,b)=>{if((b.month??0)!==(a.month??0))return (b.month??0)-(a.month??0);let ai=Number(String(a.event_id||'').split(':')[2]),bi=Number(String(b.event_id||'').split(':')[2]);return !Number.isNaN(ai)&&!Number.isNaN(bi)?bi-ai:0});pMajorList=collected}return pMajorList}
function fmtPlayerMajor(e){let pNames=[...new Set([e.actor,e.subject,e.target].filter(id=>id!==undefined&&id!==null&&world.people?.[String(id)]?.player).map(id=>world.people[String(id)].name))],badges=pNames.map(n=>`<span class="badge">✦ ${esc(n)}</span>`).join(' '),jump=e.event_id?(pMajorIds.has(e.event_id)?` · <button class="person" data-event="${esc(e.event_id)}" title="${esc(e.event_id)}">${esc(e.event_id)} ↗</button>`:` · <span title="找不到對應事件">${esc(e.event_id)}</span>`):'';return fmt(e).replace(' id="event-',' data-player-event="').replace('</small></div>',()=>`${jump}</small></div>`).replace(/(<div class="event"[^>]*>)/,m=>m+(badges?badges+' ':''))}
function playerMajorSection(){let players=Object.values(world?.people||{}).filter(p=>p&&p.player);if(!players.length)return '<p>尚未投放玩家人物。前往「創造人物」投放後，此處會顯示玩家人物的近期重大事件。</p>';if(overviewPlayerFilter!=='all'&&!world?.people?.[String(overviewPlayerFilter)]?.player)overviewPlayerFilter='all';let filterBar=players.length>1?`<div style="margin-bottom:10px"><select id="overviewPlayerFilter" aria-label="篩選玩家人物"><option value="all" ${overviewPlayerFilter==='all'?'selected':''}>全部玩家人物（${players.length} 名）</option>${players.map(p=>`<option value="${p.id}" ${String(overviewPlayerFilter)===String(p.id)?'selected':''}>✦ ${esc(p.name)}（ID ${p.id}）</option>`).join('')}</select></div>`:'',list=getPlayerMajorEvents().filter(e=>overviewPlayerFilter==='all'||[e.actor,e.subject,e.target].some(id=>id!==undefined&&id!==null&&String(id)===String(overviewPlayerFilter))).slice(0,7);return filterBar+(list.length?list.map(fmtPlayerMajor).join(''):'<p>玩家人物尚無重大事件紀錄。</p>')}
function overview(){let living=Object.values(world.people).filter(p=>p.alive).length,ev=world.events.filter(e=>e.important).slice(-7).reverse();return `<div class="grid">${stat('世界年月',`${2026+Math.floor(world.month/12)} / ${String(world.month%12+1).padStart(2,'0')}`,'每次結算一個月')}${stat('城市人口',world.background_population.toLocaleString(),'具名 NPC '+living+' 名')}${stat('靈氣知識',world.knowledge,'由人物研究取得')}${stat('組織',Object.keys(world.organizations).length,'城市現有組織')}</div><div class="layout"><div class="card"><h2>靈氣脈動</h2>${chart()}${Object.entries(world.aura).map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bar"><b style="width:${v*100}%"></b></div><span>${v.toFixed(2)}</span></div>`).join('')}</div><div><div class="card" id="playerMajorCard"><h2>玩家人物近期重大事件</h2>${playerMajorSection()}</div><div class="card" style="margin-top:18px"><h2>重大世界事件</h2>${ev.length?ev.map(fmt).join(''):'<p>世界剛開始。推進一個月，看看人物如何自主生活。</p>'}</div></div></div>`}
function creator(){let count=Object.values(world.people).filter(p=>p.player).length;return `<div class="layout"><div class="card"><h2>投放一名人物</h2><p>你決定初始條件。進入世界後，人物依性格、能力、目標與處境自行選擇。</p><form id="create"><div class="formrow"><label class="field">姓名<input id="name" required maxlength="24" placeholder="例如：林知夏"></label><label class="field">出身區域<select id="district">${districts.map(d=>`<option>${d}</option>`).join('')}</select></label><label class="field">點數測試模式<select id="budget"><option value="30">標準 · 30</option><option value="35">強化 · 35</option><option value="40">高天賦 · 40</option></select></label><label class="field">人生目標<select id="goal"><option>探索靈氣</option><option>穩定生活</option><option>建立關係</option><option>累積財富</option><option>服務社群</option></select></label></div><h3 style="margin-top:24px">先天能力 <span class="badge" id="points"></span></h3><div class="formrow">${traitNames.map(t=>`<label class="field">${t}<input class="trait" data-trait="${t}" type="number" min="1" max="10" value="6" required></label>`).join('')}</div><h3 style="margin-top:25px">情境測驗 · 16 題</h3><p>1 = 非常不同意，5 = 非常同意。此為遊戲偏好，不是心理診斷。可先套用預設再逐題調整：</p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"><button type="button" class="person" data-preset="neutral">均衡中立（全 3）</button><button type="button" class="person" data-preset="scholar">探索學者型</button><button type="button" class="person" data-preset="builder">實幹累積型</button><button type="button" class="person" data-preset="community">熱心社群型</button><button type="button" class="person" data-preset="random">隨機填答</button></div><div class="questions">${questions.map((q,i)=>`<div class="q"><label>${i+1}. ${q}</label><select class="answer"><option value="" selected disabled>請選擇</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} · ${['','非常不同意','不同意','中立','同意','非常同意'][n]}</option>`).join('')}</select></div>`).join('')}</div><button class="button" style="margin-top:22px" ${count>=3?'disabled':''}>投放世界</button></form></div><div class="card"><h2>創造者筆記</h2><p>目前已投放 ${count}/3 名。點數必須用滿，能力介於 1–10。</p><p>能力、人格、價值觀與後天技能分開記錄。點數模式只供平衡實驗，沒有付款。</p><h3>五個區域</h3>${districts.map(d=>`<span class="pill">${d}</span>`).join('')}<p class="footnote">人物的選擇由規則效用與固定種子的波動共同決定。使用「為什麼他這樣做？」可查看決策依據。</p></div></div>`}
function personListItems(){let q=personSearch.trim(),ps=Object.values(world.people).filter(p=>(personFilter==='all'||(personFilter==='player'&&p.player)||(personFilter==='alive'&&p.alive)||(personFilter==='dead'&&!p.alive))&&(!personDistrict||p.district===personDistrict)&&(!q||p.name.includes(q)||p.job.includes(q)||String(p.id)===q));return ps.length?ps.map(p=>`<button class="person ${selected===p.id?'active':''}" data-person="${p.id}">${esc(p.name)} ${p.player?'<span class="badge">✦ 玩家</span>':''}<small>${esc(p.job)} · ${esc(p.district)} · ${p.alive?'在世':'已故'}</small></button>`).join(''):'<p class="muted">無符合篩選條件的人物</p>'}
function personSelect(){return `<div style="display:grid;gap:6px;margin-bottom:10px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><select id="personFilter"><option value="all" ${personFilter==='all'?'selected':''}>全部人物</option><option value="player" ${personFilter==='player'?'selected':''}>✦ 玩家人物</option><option value="alive" ${personFilter==='alive'?'selected':''}>在世人物</option><option value="dead" ${personFilter==='dead'?'selected':''}>已故人物</option></select><select id="personDistrict"><option value="">全部區域</option>${districts.map(d=>`<option value="${d}" ${personDistrict===d?'selected':''}>${d}</option>`).join('')}</select></div><input id="personSearch" value="${esc(personSearch)}" placeholder="搜尋姓名、職業或 ID…"></div><div class="list" id="personList">${personListItems()}</div>`}
function currentPerson(){return world.people[String(selected)]||Object.values(world.people)[0]}
function observer(){let p=currentPerson(),a=p.last_action;return `<div class="layout" style="grid-template-columns:260px 1fr"><div class="card"><h3>城市人物</h3>${personSelect()}</div><div><div class="card"><div class="eyebrow">${p.player?'PLAYER CHARACTER':'AUTONOMOUS NPC'} · ID ${p.id}</div><h2 style="margin-top:9px">${esc(p.name)}</h2><p>${p.age} 歲 · ${esc(p.job)} · ${esc(p.district)} · ${p.alive?'在世':'已故'}</p><span class="pill">長期目標：${esc(p.goal)}</span><span class="pill">當前需求：${esc(p.need)}</span><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:18px">${stat('健康',p.health,'/100')}${stat('財富',p.wealth,'資源單位')}${stat('生命經過',p.months_lived,'個月')}</div></div><div class="layout"><div class="card"><h3>能力 / 技能</h3>${Object.entries(p.traits).map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bar"><b style="width:${v*10}%"></b></div><span>${v}</span></div>`).join('')}<p>${Object.entries(p.skills).map(([k,v])=>`<span class="pill">${k} ${v}</span>`).join('')}</p></div><div class="card"><h3>人格 / 價值</h3>${Object.entries(p.profile).map(([k,v])=>`<span class="pill">${k} ${Math.round(v*100)}%</span>`).join('')}<h3 style="margin-top:20px">關係</h3><p>${Object.entries(p.relations).slice(0,8).map(([id,v])=>`${esc(world.people[id]?.name||id)}：信任 ${v}`).join(' · ')||'尚無顯著關係'}</p></div></div><div class="card" style="margin-top:18px"><h3>最近行動 · 為什麼他這樣做？</h3>${a?`<p><strong>${esc(a.action)}</strong> · ${esc(a.outcome)}</p><p>目標：${esc(a.why.goal)}；需求：${esc(a.why.need)}；可知資訊：${esc(a.why.known.join('、')||'尚無發現')}；察覺靈氣：${esc(a.why.aura_observed)}</p><p>各行動基礎傾向：${Object.entries(a.why.scores).map(([k,v])=>`${k} ${v}`).join('、')}。每月加入固定種子的小幅波動。</p>`:'<p>尚未行動；推進一個月後可檢視決策。</p>'}<h3>重要記憶</h3><p>${p.memories.map(esc).join(' · ')||'尚無'}</p></div></div></div>`}
function organizations(){return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">${Object.values(world.organizations).map(o=>`<div class="card"><div class="eyebrow">ORGANIZATION ${o.id}</div><h2 style="margin-top:12px">${esc(o.name)}</h2><p>${esc(o.goal)}</p><div class="barrow"><span>資源</span><div class="bar"><b style="width:${Math.min(100,o.resources)}%"></b></div><span>${o.resources}</span></div><p>研究進展 ${o.research} · 成員 ${o.members.filter(id=>world.people[id].alive).length} 名</p><h3>近期活動</h3><p>${esc(o.activity)}</p><details><summary>查看成員</summary><p>${o.members.map(id=>esc(world.people[id].name)).join('、')}</p></details></div>`).join('')}</div>`}
function history(){let all=world.events.filter(e=>e.month===world.month);return `<div class="card"><h2>歷史回放</h2><p>選擇月份可讀取當月保存的完整世界快照。</p><label class="field">月份 <select id="historyMonth">${Array.from({length:world.month+1},(_,i)=>`<option value="${i}" ${(viewMonth===null?world.month:viewMonth)===i?'selected':''}>第 ${i} 月</option>`).join('')}</select></label><button class="button secondary" id="live" style="margin-top:12px">返回現況</button></div><div class="layout"><div class="card"><h2>本月事件</h2>${all.length?all.slice().reverse().map(fmt).join(''):'<p>尚無事件。</p>'}</div><div class="card"><h2>當月狀態</h2><p>具名存活：${Object.values(world.people).filter(p=>p.alive).length}；靈氣知識：${world.knowledge}；平均濃度：${(Object.values(world.aura).reduce((a,b)=>a+b,0)/5).toFixed(3)}</p>${chart()}</div></div>`}
function chronicle(){let p=currentPerson(),ev=p.chronicle;let recommendation=Object.values(world.people).filter(x=>x.chronicle.some(e=>e.important)).sort((a,b)=>b.chronicle.filter(e=>e.important).length-a.chronicle.filter(e=>e.important).length).slice(0,5);return `<div class="layout" style="grid-template-columns:260px 1fr"><div class="card"><h3>人物</h3>${personSelect()}</div><div><div class="card"><div class="eyebrow">LIFE CHRONICLE</div><h2 style="margin-top:9px">${esc(p.name)} 的生命歷程</h2><p>${p.age} 歲 · ${esc(p.goal)} · ${p.alive?'持續生活中':'已故，歷史保留'}</p><p>重要關係：${Object.entries(p.relations).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,v])=>`${esc(world.people[id]?.name||id)}（${v}）`).join('、')||'尚未形成'}</p><div class="timeline">${ev.length?ev.slice().reverse().map(fmt).join(''):'<p>人物尚未留下事件。平淡生活也如實呈現。</p>'}</div></div><div class="card" style="margin-top:18px"><h3>值得追蹤的人物</h3><p>依真實重大事件數量排序。</p>${recommendation.map(x=>`<button class="person" data-person="${x.id}">${esc(x.name)} · ${x.chronicle.filter(e=>e.important).length} 件重大事件</button>`).join(' ')||'<p>尚無推薦</p>'}</div></div></div>`}
function bindPersonButtons(){document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.person);render()})}
function bind(){bindPersonButtons();let pf=document.getElementById('personFilter');if(pf)pf.onchange=()=>{personFilter=pf.value;render()};let pd=document.getElementById('personDistrict');if(pd)pd.onchange=()=>{personDistrict=pd.value;render()};let ps=document.getElementById('personSearch');if(ps)ps.oninput=()=>{personSearch=ps.value;let pl=document.getElementById('personList');if(pl){pl.innerHTML=personListItems();bindPersonButtons()}};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let vals=b.dataset.preset==='random'?Array.from({length:16},()=>1+Math.floor(Math.random()*5)):answerPresets[b.dataset.preset];document.querySelectorAll('.answer').forEach((sel,i)=>{sel.value=String(vals[i])})});let bm=document.getElementById('budget'),traits=document.querySelectorAll('.trait');if(bm){let update=()=>{let vals=[...traits].map(x=>Number(x.value)||0),left=Number(bm.value)-vals.reduce((a,b)=>a+b,0);document.getElementById('points').textContent=`剩餘 ${left} 點`;document.getElementById('points').style.color=left===0?'#a9d7b7':'#ebbb85'};bm.onchange=()=>{let target=Number(bm.value),i=0;traits.forEach(x=>x.value=6);while(target>30){traits[i++%5].value=Number(traits[(i-1)%5].value)+1;target--}update()};traits.forEach(x=>x.oninput=update);update();document.getElementById('create').onsubmit=async e=>{e.preventDefault();if(advancing)return;try{let data={name:document.getElementById('name').value,district:document.getElementById('district').value,goal:document.getElementById('goal').value,budget:Number(bm.value),traits:Object.fromEntries([...traits].map(x=>[x.dataset.trait,Number(x.value)])),answers:[...document.querySelectorAll('.answer')].map(x=>Number(x.value))};let p=await api('/api/characters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});selected=p.id;await load();tab='observer';render();notice(`${p.name} 已投放世界。`)}catch(err){notice(err.message,true)}}}
let hist=document.getElementById('historyMonth');if(hist)hist.onchange=()=>{if(!advancing)load(Number(hist.value))};let live=document.getElementById('live');if(live)live.onclick=()=>{if(!advancing)load()}}
function isPlayerImportant(e){return Boolean(e.important&&[e.actor,e.subject,e.target].some(id=>id!==undefined&&id!==null&&world.people[String(id)]?.player))}
async function runAdvance(total){if(advancing||viewMonth!==null)return;advancing=true;stopRequested=false;syncControls();let done=0,totalEvents=0,totalMajor=0,pausedEvent=null;try{while(done<total){let response=await api('/api/advance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_month:world.month})});world=response.world;viewMonth=null;done++;let major=response.events.filter(e=>e.important);totalEvents+=response.events.length;totalMajor+=major.length;render();if(total===1){notice(`第 ${world.month} 月結算完成：${response.events.length} 件事件；重大變化 ${major.length} 件。`);break}let pMajor=response.events.find(isPlayerImportant);if(pMajor){pausedEvent=pMajor;break}if(done<total&&!stopRequested){notice(`連續推進中（${done}/${total}）：已完成第 ${world.month} 月…`);await new Promise(r=>setTimeout(r,0))}if(stopRequested)break}if(total>1){if(pausedEvent)notice(`連續推進於第 ${world.month} 月暫停（已完成 ${done}/${total} 個月）：玩家重大事件「${pausedEvent.text}」。`);else if(stopRequested&&done<total)notice(`已手動停止連續推進：停在第 ${world.month} 月（已完成 ${done}/${total} 個月）。`);else notice(`連續推進 ${total} 個月完成：停在第 ${world.month} 月（累計 ${totalEvents} 件事件；重大變化 ${totalMajor} 件）。`)}}catch(err){await load();notice(total>1?`連續推進於第 ${world.month} 月中斷（已完成 ${done}/${total} 個月）：${err.message}`:err.message,true)}finally{advancing=false;stopRequested=false;syncControls()}}
document.getElementById('advance').onclick=()=>runAdvance(1);
document.getElementById('batchAdvance').onclick=()=>runAdvance(Number(document.getElementById('batchMonths').value)||3);
document.getElementById('stopAdvance').onclick=()=>{if(advancing){stopRequested=true;syncControls()}};
document.addEventListener('click',async e=>{if(advancing)return;let id=e.target?.dataset?.event;if(!id)return;let source=world.events.find(x=>x.event_id===id);if(!source)return;try{tab='history';await load(source.month);render();document.getElementById('event-'+id)?.scrollIntoView({behavior:'smooth',block:'center'})}catch(error){notice(error.message,true)}});
load().catch(e=>notice(e.message,true));
</script></body></html>
