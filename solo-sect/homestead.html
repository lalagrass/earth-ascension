<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>荒居：山門之前</title><link rel="stylesheet" href="homestead.css"></head>
<body>
<header><div><a href="index.html">← 山門紀</a><h1>荒居 <small>山門之前 · H1–H8 試玩</small></h1></div><div id="time"></div></header>
<main><section class="scene"><canvas id="land" width="900" height="560" aria-label="荒居地圖"></canvas><div class="hint">每種設施都有固定地塊。點右側指派工作；清除指派後主角會自己生活。</div></section>
<aside><div id="status" class="card"></div><div class="card"><h2>時間與指派</h2><div class="row" id="speed"><button data-speed="0">暫停</button><button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="16">16×</button></div><div class="row" id="orders"></div><button id="clear">清除指派 · 自主生活</button></div><div class="card"><h2>相識與共居</h2><div id="community"></div><div id="helper-orders"></div></div><div class="card"><h2>住處與建造</h2><div id="build"></div></div><div class="card"><h2>住處儲物</h2><div id="stock"></div></div><div class="card"><h2>存檔</h2><div class="row"><button id="save">存檔</button><button id="load">讀檔</button><button id="new">新局</button></div><div id="message" role="status"></div></div><div class="card"><h2>接回山門紀（可選）</h2><p class="muted">先存荒居，再預演。這會另開本篇新局；原荒居與既有本篇存檔保留。</p><button id="transfer-preview">預演轉接</button></div><div id="transfer-manager" class="card"></div><div class="card"><h2>紀事</h2><ol id="log"></ol></div></aside></main>
<div id="start" role="dialog" aria-modal="true" aria-label="開始荒居"><div class="start-card"><h2>荒居：山門之前</h2><p>一個人來到荒地。先找野果與木材，搭間能安睡的屋子，再慢慢過上安穩日子。村路上的阿蓮會來去；你可相識，也可獨居。</p><label>名字 <input id="name" maxlength="12" value="無名"></label><label>性情 <select id="personality"><option value="quiet">喜靜</option><option value="sociable">好交往</option><option value="diligent">勤勞</option></select></label><p class="muted">性情影響自發交往和雜務偏好，不會鎖住任何生活路線。數值供試玩。</p><button id="begin">先去荒地</button><button id="resume">讀取荒居存檔</button><div id="start-transfer-manager"></div></div></div>
<dialog id="transfer-dialog" aria-labelledby="transfer-title"><h2 id="transfer-title" tabindex="-1">荒居轉接預演</h2><div id="transfer-detail"></div></dialog>
<script type="module" src="src/homestead-ui.mjs"></script></body></html>
