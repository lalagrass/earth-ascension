<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>山門紀 · solo-sect v1.45</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="wrap"><canvas id="map" width="1600" height="900"></canvas>
<aside id="panel">
 <div id="rail-head"><h1>山門紀 <small>v1.45</small></h1>
  <div id="clock"></div>
  <div class="row"><button data-speed="0">⏸</button><button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="16">16×</button></div>
  <div id="founding-action"></div>
  <div id="urgent" role="status"></div>
  <div id="micro-stage-wrap"><canvas id="micro-stage" width="360" height="220"></canvas><div id="micro-caption" title="點擊收合／展開微距實況窗"></div></div>
  <div id="focuscard"></div>
  <nav id="rail-tabs" aria-label="右欄分頁"><button data-rail="person" class="on">人物</button><button data-rail="sect">門派</button><button data-rail="journey">遠行</button><button data-rail="records">紀錄</button></nav>
 </div>
 <section data-rail-tab="person" class="active">
  <div id="hero"></div>
  <h2>武學圖</h2><div id="arts"></div>
  <h2>弟子</h2><div id="ds"></div>
  <h2>人際</h2><div id="rel"></div>
 </section>
 <section data-rail-tab="sect">
  <div id="guide"></div><div id="pace" class="row"></div><div id="locks" class="k"></div>
  <div id="routine"></div><div id="res"></div><div id="rumors"></div><div id="hermit-books"></div>
  <h2>建造</h2><div id="build"></div>
  <h2>內外門與日課</h2><div id="ranks"></div>
  <h2>工寮與雇工</h2><div id="labor"></div>
  <h2>每日收支</h2><div id="ledger"></div>
  <h2>招收</h2><div id="recruit"></div>
 </section>
 <section data-rail-tab="journey">
  <h2>巡山遠征</h2><div id="exp"></div>
  <h2>後山狩獵</h2><div id="hunt"></div>
  <h2>敵人圖鑑</h2><div id="codex"></div>
  <div id="jhui-wrap"><h2>江湖面板</h2><div id="jhui"></div></div>
 </section>
 <section data-rail-tab="records">
  <div id="chron-wrap" hidden><h2>門派大事紀</h2><div id="chron"></div></div>
  <div class="row"><button id="save">存檔</button><button id="load">讀檔</button><button id="reset">新局</button><button id="pset" title="PB-15/16/18 後製版畫像（舊圖保留）">畫像：舊</button><select id="autos"></select><button id="export">匯出存檔</button><label class="btn">匯入存檔<input id="import" type="file" accept=".json,application/json" hidden></label><button id="mute"></button></div>
  <h2>紀事</h2><ol id="log"></ol>
  <div class="row k"><button data-foldall="1">全部收合</button><button data-foldall="0">全部展開</button></div>
  <footer data-credits>致謝：<a href="https://game-icons.net/">Delapouite / game-icons.net</a>（<a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>；圖示去背、改深棕色）・霞鶩文楷（OFL）・Kenney（CC0） ・ <a href="tools/growth-preview.html">離線成長盲測驗收</a></footer>
 </section>
</aside></div>
<script type="module" src="src/main.mjs"></script></body></html>
