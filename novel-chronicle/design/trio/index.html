<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>道館三人 · 小說工作名</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font: 16px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      background: #f4efe6;
      color: #2c2822;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 16px; }
    figure { margin: 0; }
    img { width: 100%; height: auto; display: block; background: #fff; }
    figcaption { margin-top: 8px; }
    ol { margin: 8px 0 0; padding-left: 1.2rem; }
    .mark { font-size: 0.92rem; }
  </style>
</head>
<body>
  <main>
    <h1>道館三人</h1>
    <p class="mark">小說工作名，不是遊戲 canon。未連遊戲。</p>
    <figure>
      <img src="paint/courtyard-lineup.jpg" width="1280" height="720" alt="石板院子上三個孩子：左邊矮圓的男孩用扁擔挑兩隻半桶，中間瘦高的男孩輕提兩桶並側眼看他，右邊更小的女孩輕提一隻小桶。">
      <figcaption>
        <ol>
          <li>周小滿：矮圓，半桶，還在適應這具身體。</li>
          <li>周阿祁：瘦高，住在村裡，偶爾上館，看堂兄的眼神帶刺。</li>
          <li>阿岫：年紀更小，住在道館，受大家疼愛，內向而溫柔親切。此圖仍是舊版素裝；新版方向為合身細緻衣著與小髮飾，待後續改圖。</li>
        </ol>
      </figcaption>
    </figure>
  </main>
</body>
</html>
