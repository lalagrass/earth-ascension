<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山居 · 在山中留下來</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"></head><body>
<header><div class="brand"><span class="seal">山居</span><div><h1>在山中留下來</h1><small id="sect-title">第一章 · GPT 獨立版</small></div></div><div id="hud"></div><div class="time-controls"><button id="pause">暫停</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div></header>
<main class="panel-hidden"><section id="scene"><canvas id="world" aria-label="山居與遠征世界"></canvas><nav class="camera"><button data-camera="home">家園</button><button data-camera="forest">林緣</button><button data-camera="valley">溪橋</button><button data-camera="cave">古洞</button><button data-camera="all">全圖</button><button id="panel-toggle" aria-expanded="false">掌門簿</button><button id="follow">跟隨</button><button id="roof">剖屋頂</button></nav><div id="tutorial" class="hint"></div><div id="toast" role="status"></div><div id="slow"></div></section>
<aside><nav class="tabs"><button data-tab="people" class="active">人物</button><button data-tab="build">建設</button><button data-tab="stories">江湖</button><button data-tab="travel">遠征</button><button data-tab="records">紀事</button><button data-tab="save">存檔</button></nav><div id="panel"></div></aside></main>
<dialog id="start" open><form id="creation"><p class="eyebrow">山門初立 · 三人一院</p><h2>你會成為怎樣的掌門？</h2><p>破廳裡住著你、小禾與雇工阿木。用真實的勞作，留下願意同行的人。</p><div class="row"><label>人物模板<select name="template" id="template"><option value="custom">自創掌門</option><option value="guo">郭靖</option><option value="linghu">令狐沖</option><option value="yue">岳不群</option></select></label><label>姓名<input name="name" value="雲生" maxlength="16"></label><label>種子<input name="seed" value="11" inputmode="numeric"></label></div><div class="row" id="stats"></div><p id="points"></p><div class="questions"><label>眼前要緊事<select name="q0"><option value="1">先修屋</option><option value="-1">先探索</option></select></label><label>練功習慣<select name="q1"><option value="1">固定練功</option><option value="-1">隨興練功</option></select></label><label>有人落後<select name="q2"><option value="1">照顧落後者</option><option value="-1">先顧自身</option></select></label><label>路糧不多<select name="q3"><option value="1">分享口糧</option><option value="-1">保留自用</option></select></label></div><p id="personality"></p><label>江湖身份<select name="identityMode"><option value="youngRecruitable">未成名，可招募</option><option value="matureGuest">成熟作客（主角成長改寫）</option></select></label><p class="muted">經典人物僅供私人原型；同一身份只出現一位。配點各1–7，合計20。</p><p id="start-error" class="error"></p><button type="submit" class="primary">在山中留下來</button></form></dialog>
<dialog id="modal"><div id="modal-content"></div><button id="close-modal">關閉</button></dialog><script type="module" src="src/ui.mjs"></script></body></html>
